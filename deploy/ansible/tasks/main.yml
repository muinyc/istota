# ============================================================
# BACKUP TASKS
# ============================================================

- name: Create local backup directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ istota_user }}"
    group: "{{ istota_group }}"
    mode: "0755"
  loop:
    - "{{ istota_backup_local_dir }}"
    - "{{ istota_backup_local_dir }}/daily"
    - "{{ istota_backup_local_dir }}/weekly"
  when: istota_backup_enabled and not istota_web_only

- name: Create remote backup directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ istota_user }}"
    group: "{{ istota_group }}"
    mode: "0755"
  loop:
    - "{{ istota_backup_remote_dir }}"
    - "{{ istota_backup_remote_dir }}/db"
    - "{{ istota_backup_remote_dir }}/db/daily"
    - "{{ istota_backup_remote_dir }}/db/weekly"
  when: istota_backup_enabled and istota_use_nextcloud_mount and not istota_web_only

- name: Deploy istota backup script
  template:
    src: istota-backup.sh.j2
    dest: "/usr/local/bin/{{ istota_namespace }}-backup.sh"
    owner: root
    group: root
    mode: "0755"
  when: istota_backup_enabled and not istota_web_only
  tags: [backup]

- name: Deploy istota backup cron
  template:
    src: istota-backup.cron.j2
    dest: "/etc/cron.d/{{ istota_namespace }}-backup"
    owner: root
    group: root
    mode: "0644"
  when: istota_backup_enabled and not istota_web_only
  tags: [backup]

- name: Remove backup script when backups disabled
  file:
    path: "/usr/local/bin/{{ istota_namespace }}-backup.sh"
    state: absent
  when: not istota_backup_enabled and not istota_web_only

- name: Remove backup cron when backups disabled
  file:
    path: "/etc/cron.d/{{ istota_namespace }}-backup"
    state: absent
  when: not istota_backup_enabled and not istota_web_only

# ============================================================
# AUTO-UPDATE (poor man's CI)
# ============================================================

- name: Deploy auto-update script
  template:
    src: istota-update.sh.j2
    dest: "/usr/local/bin/{{ istota_namespace }}-update.sh"
    owner: root
    group: root
    mode: "0755"
  when: istota_auto_update_enabled and not istota_web_only

- name: Deploy auto-update cron
  template:
    src: istota-update.cron.j2
    dest: "/etc/cron.d/{{ istota_namespace }}-update"
    owner: root
    group: root
    mode: "0644"
  when: istota_auto_update_enabled and not istota_web_only

- name: Remove auto-update script when disabled
  file:
    path: "/usr/local/bin/{{ istota_namespace }}-update.sh"
    state: absent
  when: not istota_auto_update_enabled and not istota_web_only

- name: Remove auto-update cron when disabled
  file:
    path: "/etc/cron.d/{{ istota_namespace }}-update"
    state: absent
  when: not istota_auto_update_enabled and not istota_web_only

# ============================================================
# LEDGER BACKUP DIRECTORIES (for auto-append rotating backups)
# ============================================================

- name: Create ledger backup directories
  file:
    path: "{{ (istota_nextcloud_mount_path + '/' + item.1.path | regex_replace('^/', '')) | dirname }}/backups"
    state: directory
    owner: "{{ istota_user }}"
    group: "{{ istota_group }}"
    mode: "0755"
  loop: >-
    {{ istota_users | dict2items
       | selectattr('value.resources', 'defined')
       | subelements('value.resources')
       | selectattr('1.type', 'equalto', 'ledger')
       | list }}
  loop_control:
    label: "{{ item.0.key }} - {{ item.1.path | dirname }}/backups"
  when: istota_use_nextcloud_mount and not istota_web_only

# ============================================================
# NGINX (web UI + webhooks reverse proxy + static web root)
# ============================================================

# nginx — inlined (replace with a dedicated role if you prefer)
- name: Install nginx
  apt:
    name: nginx
    state: present
  when: (istota_location_enabled | default(false) or istota_web_enabled | default(false)) and not istota_update_only and not istota_web_only

# The web root is operator territory: root-owned, group-readable by nginx, and
# outside istota_home so no sandbox bind or istota-user write path reaches it.
- name: Create static web root
  file:
    path: "{{ istota_web_root_path }}"
    state: directory
    owner: "{{ istota_web_root_owner }}"
    group: "{{ istota_web_root_group }}"
    mode: "{{ istota_web_root_dir_mode }}"
  when:
    - istota_web_root_enabled | default(true)
    - istota_location_enabled | default(false) or istota_web_enabled | default(false)
    - not istota_web_only

# force: no — the placeholder seeds an empty root once; operator content wins
# on every subsequent run.
- name: Deploy placeholder index.html when the web root has none
  template:
    src: index.html.j2
    dest: "{{ istota_web_root_path }}/index.html"
    owner: "{{ istota_web_root_owner }}"
    group: "{{ istota_web_root_group }}"
    mode: "{{ istota_web_root_file_mode }}"
    force: no
  when:
    - istota_web_root_enabled | default(true)
    - istota_location_enabled | default(false) or istota_web_enabled | default(false)
    - not istota_web_only

- name: Deploy nginx config
  template:
    src: istota.conf.j2
    dest: "/etc/nginx/conf.d/{{ istota_hostname }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: (istota_location_enabled | default(false) or istota_web_enabled | default(false)) and not istota_web_only
  notify:
    - reload nginx

- name: Remove nginx config when all features disabled
  file:
    path: "/etc/nginx/conf.d/{{ istota_hostname }}.conf"
    state: absent
  when: not (istota_location_enabled | default(false)) and not (istota_web_enabled | default(false)) and not istota_web_only
  notify:
    - reload nginx

- name: Force handlers to run now
  meta: flush_handlers
  when: not istota_web_only

- name: "Enable and start istota-scheduler"
  systemd:
    name: "{{ istota_namespace }}-scheduler"
    enabled: yes
    state: started
    daemon_reload: yes
  when: not istota_web_only

# Update-only mode is "pull latest code, restart services". Handler-based
# restarts only fire when a task reports `changed`, so an idempotent rerun
# (git already at HEAD, config.toml unchanged) leaves the running services
# pinned to old code. Force the restart explicitly here, mirroring the
# `istota_web_only` pattern further up the file.
- name: Restart services (update-only mode)
  systemd:
    name: "{{ item.name }}"
    state: restarted
  loop:
    - { name: "{{ istota_namespace }}-scheduler", enabled: true }
    - { name: "{{ istota_namespace }}-web", enabled: "{{ istota_web_enabled | default(false) }}" }
    - { name: "{{ istota_namespace }}-webhooks", enabled: "{{ istota_location_enabled | default(false) }}" }
  when: istota_update_only and (item.enabled | bool)

# ISSUE-428: the auto-update cron's early exit compares against this marker
# rather than against HEAD movement, so a play that deploys new code has to
# write it too. Left unwritten, the marker would still name the pre-play sha
# and the next two-minute tick would re-run dependencies, the frontend build
# and every restart against a checkout the play had just finished deploying.
#
# **Never under `istota_web_only`**, which is the half of this that is not
# bookkeeping. The clone task carries no `when:`, so a web-only run advances
# HEAD to the branch tip — while `uv sync`, the schema migration and the
# scheduler start are all gated on `not istota_web_only`. Recording that as a
# completed deploy would make the cron's early exit fire for ever, leaving the
# scheduler on pre-update code against an unmigrated database with nothing in
# the update log to say so. Before this marker existed the same play was
# harmless, because the next tick redeployed.
#
# After `meta: flush_handlers` above, so a failed restart is not recorded as a
# completed deploy — and that flush is itself `when: not istota_web_only`, so
# the guard below is what keeps the ordering claim true rather than merely
# stated.
- name: Create the deployment state directory
  file:
    path: /var/lib/{{ istota_namespace }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not istota_web_only

- name: Record the deployed revision
  copy:
    content: "{{ _istota_deployed_sha.stdout | default('') | trim }}\n"
    dest: /var/lib/{{ istota_namespace }}/last-deployed-sha
    owner: root
    group: root
    mode: "0644"
  when:
    - not istota_web_only
    - (_istota_deployed_sha.stdout | default('') | trim) != ""

- name: Display deployment info
  debug:
    msg:
      - "{{ istota_namespace | capitalize }} has been deployed to {{ istota_home }}"
      - "Scheduler daemon handles all polling (Talk, email, TASKS.md)"
      - "Service: {{ istota_namespace }}-scheduler"
      - "Logs: journalctl -u {{ istota_namespace }}-scheduler -f"
  when: not istota_web_only
