---
# Istota deployment defaults

# Namespace - sets all downstream defaults (user, group, paths, services, etc.)
# Override individual variables below to diverge from namespace where needed
istota_namespace: "istota"

# Python package name (module imports). Always "istota" regardless of namespace.
# Env vars use the literal ISTOTA_ prefix, not derived from this.
istota_package: "istota"

# Update mode - skip full installation, just pull code and update config
# Usage: ansible-playbook playbook.yml -e "istota_update_only=true"
istota_update_only: false

# Web-only mode - just pull code, rebuild web UI, restart web service
# Usage: ansible-playbook playbook.yml -e "istota_web_only=true"
istota_web_only: false

# Application paths
istota_home: "/srv/app/{{ istota_namespace }}"
istota_user: "{{ istota_namespace }}"
istota_group: "{{ istota_namespace }}"

# User-facing bot identity name (display only; defaults to namespace capitalized)
istota_bot_name: ""
# Include emissaries.md (constitutional principles) in system prompts
istota_emissaries_enabled: true

# Model selection. Per-task model+effort precedence: !model override (Talk) >
# a per-task pin > the running brain's own configured default. See
# .claude/rules/config.md, docs/configuration/native-brain.md. A per-task model
# pin (from any of the above) also suppresses istota_advisor_model for that
# task — see the comment below.

# DEPRECATED (ISSUE-418). These were the claude_code brain's own default living
# at the top level, where the executor applied them to whatever brain ran and
# they shadowed that brain's configured default — so a room pinned to `native`
# with istota_brain_native_model set still ran the Claude model, against the
# native endpoint and billed per token. They still work: each per-brain value
# below falls back to them, so an existing host keeps its behaviour with no
# variable change. Set the per-brain ones instead.
istota_model: ""
istota_effort: ""

# Each CLI brain's own default model + effort ("" = the CLI's own default).
# Both accept a canonical id, a shortcut (opus/sonnet/haiku), or a role tier
# (smart/general/fast), plus an optional orthogonal :effort modifier
# (opus:high). Both blocks are read whatever istota_brain_kind is, since a
# fallback or a source_type_overrides entry can route to either.
#
# They default from istota_model / istota_effort, which is what makes the
# migration exactly behaviour-preserving: that value *was* the default for
# whichever CLI brain ran, and these two share the anthropic namespace and the
# same `claude` binary, so it is equally valid in either. istota_brain_native_*
# deliberately does not default from them — an Anthropic model id cannot carry
# to an openai_compat endpoint, which is the defect itself.
istota_brain_claude_code_model: "{{ istota_model }}"
istota_brain_claude_code_effort: "{{ istota_effort }}"
istota_brain_tmux_model: "{{ istota_model }}"
istota_brain_tmux_effort: "{{ istota_effort }}"

# Advisor model ("" = no advisor). Anthropic-namespace brains only
# (claude_code / tmux_claude) — the advisor tool has no wire over the native
# brain's openai_compat endpoint. Resolves through istota_models_aliases but
# carries no effort, and must be a model capable of being an advisor: a weak
# tier is rejected outright rather than downgraded. A per-task model pin (!model,
# !room model, a [[jobs]] model) drops the advisor for that task.
istota_advisor_model: ""

# Model alias registry ([models.aliases]), overlaying the code-shipped defaults
# (tiers fast/general/smart + shortcuts opus/sonnet/haiku). Aliases are per model
# namespace so one definition works on every brain: `anthropic` = the CLI brains,
# `openai_compat` = native. Each entry is a {model, effort} pair, where effort is
# the orthogonal :effort modifier and "" means the model default. Custom aliases
# stay a pin unless flagged `portable: true`.
istota_models_aliases:
  fast:
    anthropic:
      model: "claude-haiku-4-5"
      effort: ""
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "low"
  general:
    anthropic:
      model: "claude-sonnet-5"
      effort: ""
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "medium"
  smart:
    anthropic:
      model: "claude-opus-5"
      effort: "high"
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "high"

# Use config/system-prompt.md instead of Claude Code's default system prompt.
# The CLI reads that file from inside the sandbox, so build_bwrap_cmd binds it
# read-only — it needs no entry in istota_security_sandbox_ro_paths below.
istota_custom_system_prompt: true

# Brain — selects the model-invocation backend:
#   "claude_code" (default) wraps the headless `claude -p` CLI subprocess.
#   "native"      runs istota's in-process agent loop against an OpenAI-compatible provider.
#   "tmux_claude" drives the interactive `claude` TUI in a detached tmux session (needs tmux).
# All coexist behind the Brain protocol (src/istota/brain/). Runbook: docs/configuration/native-brain.md.
istota_brain_kind: "claude_code"

# Which brain kinds a room may pin for itself ([brain] room_selectable), with
# `!brain` in the room or the web room settings, and which a scheduled job may
# pin with `brain` in CRON.md. The name is narrower than the setting: one list
# bounds every pin written outside this play. Empty means none may, so the
# feature is inert until you name kinds here. A gate rather than a preference:
# brain kind decides which process holds the agent loop, what tool set it
# registers and which SandboxProfile is built, so it is not something an upgrade
# should switch on. Writing a room's brain, or a job's, is admin-only on top of
# this, and neither a pinned room nor a pinned job fails over — it runs the
# brain it names or fails saying why. Listing a kind also widens the doctor
# checks for it (`claude` on PATH, tmux, a native API key), whether or not
# anything has selected it.
# Values: a list drawn from "claude_code", "native", "tmux_claude".
istota_brain_room_selectable: []

# Brain fallback ([brain] fallback_*). When the primary brain is unavailable
# (usage limit, missing binary, tmux launch failure) the task runs on the
# fallback with its own settings. Portable role tiers cross the provider
# boundary; a provider-specific pin drops to the fallback's default. Single level
# only. "" = no fallback, whatever the primary kind (ISSUE-362); the expression
# below keeps a tmux_claude deployment on the failover it had before that change,
# including one reached through source_type_overrides.
# Values: "" | "claude_code" | "native" | "tmux_claude".
istota_brain_fallback: "{{ 'claude_code' if (istota_brain_kind == 'tmux_claude' or 'tmux_claude' in (istota_brain_source_type_overrides | default({})).values()) else '' }}"
istota_brain_fallback_on_transient: true        # also reroute a persistent transient_api_error
istota_brain_fallback_cooldown_seconds: 3600    # skip an unavailable primary this long; 0 disables

# Native brain ([brain.native]). Emitted to config.toml only when native is the
# kind, the fallback, or a source_type_overrides target. Defaults match the code;
# most operators set model + base_url + the API key. Pin istota_brain_native_model
# whenever native is primary OR fallback (an empty model id 400s on failover).
istota_brain_native_provider: "openai_compat"     # only provider currently
istota_brain_native_model: "z-ai/glm-5.3-flash"   # explicit id (no aliasing)
istota_brain_native_effort: "high"                # low/medium/high/xhigh/max ("" = none); sent only to thinking-capable models
istota_brain_native_base_url: "https://openrouter.ai/api/v1"
istota_brain_native_extra_headers: {}             # extra HTTP headers (openai_compat)
istota_brain_native_context_window: 0             # 0 = resolve from OpenRouter catalog / 200k default; set real window for non-OpenRouter
istota_brain_native_max_turns: 100                # hard cap on assistant turns per task
istota_brain_native_max_tokens: 32000             # per-completion output cap
istota_brain_native_model_catalog_fetch: true     # fetch OpenRouter model list for real window/capabilities/prices (no-op off OpenRouter)
istota_brain_native_model_catalog_cache_ttl_hours: 24  # disk-cache freshness for the fetch above
istota_brain_native_bash_spill_full_output: true  # spill over-cap Bash output to a temp file named in the result
istota_brain_native_turn_budget_nudge: true       # nudge the model to pace itself as it nears max_turns
istota_brain_native_turn_budget_nudge_early_percent: 50   # first (~halfway) reminder fires at this % of the cap
istota_brain_native_turn_budget_nudge_remaining: [15, 5]  # escalating late fires at these absolute steps-remaining
istota_brain_native_soft_deadline_percent: 90     # stop at this % of the task timeout, keeping partial work (0 or >= 100 disables)
istota_brain_native_prompt_caching: ""            # "" = derive from base_url (ON for api.anthropic.com); set true/false to force

# Native-brain WebFetch tool ([brain.native.web_fetch]). Runs in the daemon
# (host netns), credential-free and SSRF-hardened, not gated by the bwrap CONNECT
# allowlist. Safe defaults; only enabled/allow_http commonly change.
istota_brain_native_web_fetch_enabled: true       # master switch; false omits the tool
istota_brain_native_web_fetch_allow_http: false   # permit cleartext http:// (off = HTTPS only)
istota_brain_native_web_fetch_timeout_seconds: 20 # total wall-clock per fetch
istota_brain_native_web_fetch_max_bytes: 5000000  # response body byte cap (streamed)
istota_brain_native_web_fetch_max_content_chars: 100000  # extracted-text cap returned to the model
istota_brain_native_web_fetch_max_redirects: 5    # redirect hops before giving up
istota_brain_native_web_fetch_require_url_provenance: false  # only fetch URLs seen in the task (sensitive deployments)
istota_brain_native_web_fetch_allow_hosts: []     # if non-empty, a host allowlist (suffix match)
istota_brain_native_web_fetch_block_hosts: []     # always-denied hosts (suffix match)
istota_brain_native_web_fetch_extra_blocked_cidrs: []  # operator additions to the private/reserved IP blocklist

# Native-brain session transcripts ([brain.native.session_log]). One
# append-only JSONL file per task attempt, holding the assembled prompt, every
# assistant turn and every tool result — the artifact that answers "what did
# the model actually see and do" when a task answered wrongly.
#
# `dir` blank resolves to {db_path.parent}/logs (local disk, behind the
# sandbox's database mask). A value set here is used AS GIVEN and the retention
# sweep unlinks *.jsonl beneath it, so write an absolute path to a directory
# istota owns. The two limits are independent and either can evict:
# retention_days for privacy, max_total_gb for the disk across every user.
istota_brain_native_session_log_enabled: true
istota_brain_native_session_log_dir: ""           # "" = {db_path.parent}/logs
istota_brain_native_session_log_retention_days: 14  # 0 = keep for ever by age; the ceiling still applies
istota_brain_native_session_log_max_total_gb: 2.0   # deployment-wide, all users summed; clamped to a 0.5 floor
istota_brain_native_session_log_max_content_chars: 32768  # per text/thinking block, head-and-tail truncated. 0 = NO cap
istota_brain_native_session_log_max_args_chars: 8192      # per tool-call arguments object. 0 = no cap
istota_brain_native_session_log_include_thinking: true    # reasoning traces: the most useful record, and the bulkiest

# Per-tier native model overrides live in each tier's openai_compat key in
# istota_models_aliases (above), defaulting to istota_brain_native_model.
# Instance-wide provider API key — never written to config.toml; rendered into
# the EnvironmentFile as ISTOTA_BRAIN_NATIVE_API_KEY. Vault this. Per-user keys
# go through istota_user_secrets (service: native_brain, key: api_key).
istota_brain_native_api_key: ""

# Per-source-type brain routing ([brain.source_type_overrides]). Map a task
# source_type to a brain kind, overriding istota_brain_kind for matching tasks
# (e.g. cron/heartbeat on native while talk/email stays on claude_code). Example:
#   istota_brain_source_type_overrides:
#     scheduled: native
#     heartbeat: native
istota_brain_source_type_overrides: {}

# Tmux-driven interactive-TUI brain ([brain.tmux]). Emitted to config.toml only
# when tmux_claude is the kind, the fallback, or a source_type_overrides target.
# Drives the interactive `claude` TUI in a detached tmux session; needs tmux on
# the host, and istota_brain_fallback defaults to claude_code for it. Runbook:
# .claude/rules/brain.md. The marker lists are pane-text heuristics pinned to a
# CLI version — override on a CLI reword, no code release needed.
istota_brain_tmux_fallback_trip_threshold: 5       # launch failures before the circuit opens
istota_brain_tmux_fallback_cooldown_seconds: 300   # seconds the circuit stays open
istota_brain_tmux_ready_timeout_seconds: 30        # REPL-ready deadline
istota_brain_tmux_command_timeout: 10              # per-tmux-subprocess timeout
istota_brain_tmux_cli_version_pin: "2.1.168"       # supported claude CLI version
istota_brain_tmux_ready_markers: []                # [] → code defaults
istota_brain_tmux_trust_markers: []                # [] → code defaults
istota_brain_tmux_theme_markers: []                # [] → code defaults (first-run theme picker)
istota_brain_tmux_error_markers: []                # [] → code defaults
istota_brain_tmux_usage_limit_markers: []          # [] → code defaults (pane substrings → stop_reason=usage_limit → fallback)
istota_brain_tmux_bypass_warning_marker: ""        # "" → code default
istota_brain_tmux_bypass_accept_marker: ""         # "" → code default

# Claude CLI authentication
# Preferred: generate a token locally with `claude setup-token`, store in vault
# Fallback: authenticate manually with `sudo -u <namespace> claude login`
istota_claude_code_oauth_token: ""

# Git repository
istota_repo_url: "https://github.com/istota-project/istota.git"
istota_repo_branch: main
istota_repo_tag: "latest"  # "latest" = highest semver tag, "v0.2.0" = specific tag, "" = use branch
istota_repo_dir: "{{ istota_home }}/istota"

# GitLab access token for cloning the istota repo itself (private repos).
# Generate at GitLab > Settings > Access Tokens, read_repository scope. NOT
# istota_developer_gitlab_token, which feeds the developer skill's API access.
istota_repo_clone_token: ""

# Scheduler settings
istota_scheduler_poll_interval: 5
istota_scheduler_dispatch_interval: 0.5       # Sub-tick pending-task dispatch cadence (0 or >= poll_interval = legacy)
istota_scheduler_talk_poll_interval: 10       # Talk conversation polling interval
istota_scheduler_talk_poll_timeout: 30        # Talk long-poll timeout
istota_scheduler_talk_poll_wait: 2.0         # Max seconds to wait before processing fast rooms
istota_scheduler_talk_poll_full_sweep_interval: 300  # Poll every room regardless of the lastMessage gate; 0 = no gate
istota_scheduler_email_poll_interval: 60
istota_scheduler_email_poll_batch_size: 50
istota_scheduler_email_rate_limit_messages: 60          # Inbound email tasks per user per window (0 = unlimited)
istota_scheduler_email_sender_rate_limit_messages: 20   # …and per sender, under the per-user budget (0 = unlimited)
istota_scheduler_email_rate_limit_window_seconds: 3600
istota_scheduler_email_confirmation_prompts_per_window: 3  # Gate prompts per (user, sender) before they collapse (0 = never)
istota_scheduler_email_task_queue: background            # "foreground" puts inbound mail back on the interactive queue
istota_scheduler_email_max_body_chars: 32000
istota_scheduler_email_max_attachment_bytes: 26214400          # 25 MiB per message
istota_scheduler_email_max_attachment_bytes_per_poll: 104857600  # 100 MiB per poll tick
istota_scheduler_briefing_check_interval: 60
istota_scheduler_tasks_file_poll_interval: 30
istota_scheduler_shared_file_check_interval: 120  # Shared file organization check interval
istota_scheduler_heartbeat_check_interval: 60    # Heartbeat monitoring check interval
istota_scheduler_db_health_check_interval: 86400 # SQLite quick_check + REINDEX sweep (default daily)
istota_scheduler_worktree_reap_interval: 21600 # developer-worktree reaping sweep (ISSUE-288, 6h; 0 disables)
# Package-cache sweep (ISSUE-317). Inert unless a cache root resolves — the
# derived one under istota_developer_repos_dir, or istota_security_sandbox_cache_dir.
istota_scheduler_sandbox_cache_sweep_interval: 21600 # 6h; 0 disables
# Nextcloud profile-picture import. Also gated by
# istota_web_avatar_import_from_nextcloud and by a Nextcloud storage backend.
# Six-hourly rather than daily: a new user sees the initial chip until the tick.
istota_scheduler_avatar_import_interval: 21600 # 6h; 0 disables
istota_scheduler_main_loop_read_timeout_ms: 2000 # Busy-timeout for dispatch read scans; a lock past this skips the tick (0 = 30s)
istota_scheduler_db_backup_enabled: true         # Snapshot local DBs (framework + modules) to the mount for off-host durability
istota_scheduler_db_backup_interval: 86400       # Seconds between DB backup snapshots (default daily)
istota_scheduler_db_backup_dir: ""               # Snapshot destination; empty = {nextcloud_mount}/istota-db-backups
istota_scheduler_db_backup_retention: 7          # Newest snapshot dirs to keep (0 = all); the newest good copy of a DB is never pruned
istota_scheduler_stats_interval: 60              # scheduler_stats health line interval (0 = disabled)
# Host memory breadcrumb: one host_pressure line per interval carrying
# MemAvailable / Shmem / SwapFree / PSI / per-tmpfs usage / shmem_unaccounted,
# written whether or not the box is under pressure — a threshold-gated record
# misses a slow shmem leak entirely. 288 lines/day at 300s.
istota_scheduler_host_pressure_enabled: true     # Master switch for host-pressure sampling
istota_scheduler_host_pressure_breadcrumb_interval: 300  # Breadcrumb cadence in seconds (0 = disabled)

# Memory admission gate + threshold snapshot. Below the floor, dispatch spawns
# no new worker and pending tasks wait for a later tick; nothing running is ever
# stopped, preempted or failed.
istota_scheduler_host_pressure_sample_interval: 30   # Gate/snapshot sample cadence in seconds (0 = disabled)
istota_scheduler_host_pressure_psi_threshold: 40.0   # `memory some avg10` above this counts as pressure
istota_scheduler_host_pressure_alert_cooldown: 900   # Min seconds between snapshots + admin notifications
istota_scheduler_min_available_memory_mb: 768        # Admission floor
# Third snapshot trigger: a shmem burst large enough to be worth attributing
# even when PSI and MemAvailable are both fine. Snapshot only — it does not feed
# the admission gate, since a residue is a reason to collect evidence rather
# than to refuse work. Baseline residue on the reference host is ~80 MB.
# 0 disables.
istota_scheduler_host_pressure_shmem_alert_mb: 1024
# Read-only GET handle, used only to ask Docker which pid a container has so
# its tmpfs can be read through /proc/<pid>/root — container mounts are
# invisible in the host mount table. Empty string disables container lookup.
istota_scheduler_host_pressure_docker_socket: /var/run/docker.sock

# ---------------------------------------------------------------------------
# Host memory headroom
# ---------------------------------------------------------------------------
# A host with no swap cannot evict anonymous pages and cannot reclaim
# tmpfs/shmem at all, so a memory shortfall becomes a thrash-to-death. zram
# rather than a disk swapfile because the disk is usually the resource already
# under strain: it compresses cold pages in RAM (zstd, ~3:1) and adds no disk
# traffic.
#
# Sizing: zram-size is the device's UNCOMPRESSED logical capacity, and
# compression happens beneath it. `ram / 2` on an 8 GB box is a ~4 GB swap
# device costing ~1.3 GB of real RAM at 3:1 — not "10-12 GB effective", which
# would need `ram * 1.5`. Over-provisioning makes the incompressible worst case
# fatal on its own. A mitigation, not a fix: a real leak outgrows it.
#
# false makes every zram task a no-op, so a host where swap was arranged another
# way is left alone. It does NOT tear down a device this role already created —
# remove that by hand with `systemctl disable --now systemd-zram-setup@zram0`
# and deleting /etc/systemd/zram-generator.conf.
istota_zram_enabled: true                # Install systemd-zram-generator and enable a zram swap device
istota_zram_size: "ram / 2"              # UNCOMPRESSED capacity, not RAM cost: ~4 GB of swap for ~1.3 GB of RAM at 3:1
istota_zram_algorithm: "zstd"            # Compression algorithm
istota_zram_priority: 100                # Swap priority. Linux prefers the HIGHER number, so this must stay above the swapfile

# Optional second tier: a disk swapfile at a LOWER priority than zram, for pages
# cold enough that even compression is wasted. Off by default. Assumes ext4 —
# fallocate-backed swap needs different handling on btrfs.
istota_swapfile_enabled: false           # Second-tier disk swapfile
istota_swapfile_size_mb: 2048
istota_swapfile_path: /swapfile
istota_swapfile_priority: 10             # Below istota_zram_priority, so zram is filled first

# Soft throttling on the istota units. MemoryHigh, NOT MemoryMax: past the limit
# the kernel throttles the cgroup with reclaim pressure, where a hard cap would
# kill the daemon and take everything down with it. A guard against a future
# regression — istota's own footprint is around 1.2 GB. Empty string omits the
# directive entirely.
istota_scheduler_memory_high: "5G"       # MemoryHigh= on the scheduler unit ("" = no throttle). Covers the daemon PLUS
                                         # every claude subprocess and its children, not the daemon alone
istota_web_memory_high: "1G"             # MemoryHigh= on the web and webhooks units ("" = no throttle)

# Below the systemd default of 100, so every other unit wins under contention.
# No CPUQuota is set deliberately: the contention observed here was memory, with
# the cores idle-waiting, and a quota slows the work without helping.
istota_scheduler_cpu_weight: 50          # CPUWeight= on the scheduler unit ("" = systemd default of 100)

# Local-disk root for per-user module DBs (feeds/health/location/money). MUST be
# local disk, NOT the Nextcloud mount (WAL -shm SIGBUSes on FUSE). Only the .db
# relocates here; user-facing module files stay in the workspace on the mount.
istota_module_data_dir: "{{ istota_home }}/data/modules"

# Scheduler progress / event streaming
istota_scheduler_progress_updates: true                # Show real-time progress in Talk during execution
istota_scheduler_progress_show_tool_use: true          # Emit tool_start / tool_end events
istota_scheduler_progress_show_text: false             # Emit intermediate assistant text events (noisy)
istota_scheduler_event_log_enabled: true               # Write events to the task_events table (kill-switch)
istota_scheduler_stream_text_gate_chars: 280           # Hold streamed answer text until N chars without a tool call (web/REPL);
                                                       # 0 disables. Watch `stream_gate:` logs to tune
istota_scheduler_push_notification_threshold_seconds: 30  # Min task duration before a push notification fires
istota_scheduler_push_notification_sources: []   # source_types that trigger a completion push; empty = ntfy opt-in only
istota_scheduler_task_timeout_minutes: 60             # Kill task execution after N minutes
istota_scheduler_log_channel_show_skills: true        # Include selected skills in log channel messages

# Scheduler robustness settings
istota_scheduler_confirmation_timeout_minutes: 120  # Auto-cancel pending confirmations
istota_scheduler_stale_pending_warn_minutes: 30     # Log warnings for stale tasks
istota_scheduler_stale_pending_fail_hours: 2        # Auto-fail ancient pending tasks
istota_scheduler_max_retry_age_minutes: 60           # Don't retry stuck tasks older than this
istota_scheduler_worker_heartbeat_seconds: 60        # Running worker pings liveness this often (0 disables)
istota_scheduler_worker_stuck_minutes: 10            # Reclaim a task after this much heartbeat silence (higher = fewer false reclaims)
istota_scheduler_task_retention_days: 7             # Delete old completed tasks
istota_scheduler_email_retention_days: 7            # Delete old emails from IMAP (0 to disable)
istota_scheduler_processed_email_retention_days: 90 # Prune the dedup ledger (0 disables; floored at email_retention_days + 1)
istota_scheduler_worker_idle_timeout: 10           # Cumulative-idle seconds a worker lingers (re-checking) before exiting
istota_scheduler_worker_idle_poll_interval: 0.5    # Idle re-check cadence (0 or >= worker_idle_timeout = legacy single wait)
istota_scheduler_max_foreground_workers: 5         # Instance-level foreground (interactive) worker cap
istota_scheduler_max_background_workers: 3         # Instance-level background (scheduled/briefing) worker cap
istota_scheduler_user_max_foreground_workers: 2    # Global per-user fg worker default
istota_scheduler_user_max_background_workers: 1    # Global per-user bg worker default
# Elapsed-time slot reclassification: a running foreground task older than the
# threshold stops counting against its user's interactive cap. Both allowances
# bound discounts, not long tasks — per-user additive, instance-wide partitioned
# inside max_foreground_workers, which stays the hard ceiling. 0 disables.
istota_scheduler_long_task_threshold_minutes: 10   # A running fg task older than this stops counting as interactive
istota_scheduler_user_max_long_workers: 1          # Per-user discount allowance (additive)
istota_scheduler_max_long_workers: 2               # Instance-wide discount budget (inside max_foreground_workers)
# Per-task cgroups (A6). Each task's process tree gets its own cgroup v2 group
# under the scheduler unit, so a tree that overruns is OOM-killed inside it
# rather than taking the host with it. Depends on Delegate= + DelegateSubgroup=
# on the unit; where those are absent the daemon logs the reason once at
# startup and every task runs exactly as it did before.
istota_scheduler_task_cgroup_enabled: true         # Place each task's tree in its own cgroup
istota_scheduler_task_memory_max_mb: 2048          # memory.max per task (0 = unbounded)
istota_scheduler_task_pids_max: 512                # pids.max per task — bounds a fork storm
istota_scheduler_task_cpu_max_percent: 200         # cpu.max as % of one core (200 = two cores; 0 = unset)
istota_scheduler_scheduled_job_max_consecutive_failures: 5  # Auto-disable after N failures (0=never)
istota_scheduler_cron_max_staleness_minutes: 60             # Skip catch-up fires older than this (jobs + briefings); 0 = always catch up
istota_scheduler_max_subtasks_per_task: 10                  # Cap deferred subtasks created per task
istota_scheduler_max_subtask_depth: 3                       # Max subtask chain depth (0=unlimited)
istota_scheduler_max_subtask_prompt_chars: 8000             # Skip deferred subtasks with prompts over this size (0=unlimited)
istota_scheduler_talk_cache_max_per_conversation: 200      # Max cached talk messages per conversation
istota_scheduler_temp_file_retention_days: 7               # Delete temp files older than N days (0=disable)
istota_scheduler_location_ping_retention_days: 365         # Delete location pings older than N days (0=unlimited)

# Logging settings
istota_logging_level: "INFO"                        # INFO or DEBUG
istota_logging_output: "both"                       # console, file, or both
istota_logging_file: "/var/log/{{ istota_namespace }}/{{ istota_namespace }}.log"
istota_logging_rotate: true                         # Let Python handle rotation (logrotate also configured)
istota_logging_max_size_mb: 10
istota_logging_backup_count: 5

# Host log retention. Neither journald nor auditd ships with a working cap on
# Debian, and together they can reach several GB on a small root. journald's
# [Journal] section is empty out of the box, so the cap falls back to 10% of
# the filesystem; the drop-in makes it explicit.
istota_journald_manage: true
istota_journald_max_use: "500M"        # total journal size across all files
istota_journald_max_file_size: "50M"   # per-file cap, so rotation stays granular
#
# auditd ships max_log_file_action = keep_logs, which overrides num_logs and
# never deletes: it rotates forever and every 6MB file stays. ROTATE is what
# turns num_logs into an actual bound. Set istota_auditd_manage to false if the
# host's audit policy is owned by something else.
istota_auditd_manage: true
istota_auditd_num_logs: 5
istota_auditd_max_log_file: 6          # MB per file, so the cap is num_logs * this
istota_auditd_max_log_file_action: "ROTATE"

# The claude CLI self-updates and leaves each previous build behind at ~320MB.
# Nothing reaps them, so the directory grows by a release every day or two.
# Keep at least 2: one live, one to roll back to after a bad release.
istota_claude_versions_keep: 2

# Nextcloud settings (required)
istota_nextcloud_url: ""
istota_nextcloud_username: "{{ istota_namespace }}"
istota_nextcloud_app_password: ""
# Default expiry applied by `nextcloud share link`. 0 = no default expiry.
istota_nextcloud_share_default_expire_days: 14

# Explicit CalDAV server ([caldav]), overriding the calendar URL / username /
# password otherwise derived from [nextcloud]. For a deployment whose calendar
# lives somewhere other than the Nextcloud it authenticates against. Leave the
# URL blank — the default — and no block is rendered at all.
#
# The password goes to the EnvironmentFile as ISTOTA_CALDAV_PASSWORD, like
# istota_email_imap_password; vault it.
#
# SET BOTH OR NEITHER, and the template enforces it rather than trusting you to.
# Config.caldav_url / _username / _password each fall back to [nextcloud] on
# their own, so a url with no password is not an override that fails to
# authenticate — it points the daemon at a foreign host and hands that host the
# Nextcloud app password. A password with no url is the mirror image: it
# authenticates to Nextcloud's own DAV endpoint with the wrong secret. Either
# half alone renders nothing at all.
istota_caldav_url: ""
istota_caldav_username: ""
istota_caldav_password: ""

# Create each user's default Talk rooms (#general / #logs / #alerts) and seed
# the log/alerts channel tokens into their profile (ISSUE-115). Without it a
# bare-metal install starts with an empty `log_channel` and no execution log.
#
# Idempotent, and it cannot overrule a human: a channel whose column is already
# set gets no room created, and a token is written only for a room this run made
# usable — so a channel cleared in the web UI stays cleared across deploys
# (ISSUE-102). Re-point one on purpose with
# `istota nextcloud provision-rooms --user U --reseed`. Renaming a room is safe;
# the token is remembered on first provision and matched on later runs
# (ISSUE-342).
#
# Also gated on istota_talk_enabled and a non-empty app password. false to
# manage the rooms yourself.
istota_provision_talk_rooms: true

# Talk settings (polling-based, no webhook needed)
istota_talk_enabled: true
istota_talk_bot_username: "{{ istota_namespace }}"  # Nextcloud username (to filter own messages)

# Receive Talk messages over Nextcloud's standalone signaling server (the
# high-performance backend) instead of polling for them. Off by default, and
# there is no credential here: istota authenticates as its own Nextcloud user,
# so the server URL, the connection token and the per-room session are minted
# on demand by Talk. Requires the server already registered with Talk
# (`occ talk:signaling:list`) and the `websockets` library, and the daemon
# **refuses to boot** if it is switched on without either — quietly polling
# while an operator believes push is live is the worse failure.
istota_talk_signaling_enabled: false
# Empty means "use whatever Talk advertises". Set it only where the daemon must
# reach the server by a different route than the one browsers are given.
istota_talk_signaling_url: ""
# Seconds between room reconciliations. Also the safety net: the pass compares
# each room's latest message id against its cursor and fetches only the rooms
# behind, so it bounds how long a gap lasts if the stream stops.
istota_talk_signaling_room_sync_interval: 300
# Reconnect backoff ceiling, seconds. A proxy in front of the server typically
# drops every connection hourly whatever the traffic, so reconnect is routine.
istota_talk_signaling_reconnect_backoff_max: 60
# Ingest the relayed message instead of refetching the room. Off by default: it
# is the only part of this path that can be wrong about message content rather
# than timing, and Talk relays a message at all only from about Talk 21.
istota_talk_signaling_payload_direct: false

# Email settings (optional)
istota_email_enabled: false
istota_email_imap_host: ""
istota_email_imap_port: 993
istota_email_imap_user: ""
istota_email_imap_password: ""
istota_email_smtp_host: ""
istota_email_smtp_port: 587
istota_email_poll_folder: "INBOX"
istota_email_bot_address: ""
istota_email_imap_timeout_seconds: 30  # socket timeout for IMAP connections
# What an own-address claim buys. Three states, weakest first:
#
#   "off"     the claim is proof. Sound only if something upstream (normally
#             DMARC at the receiving MTA) rejects a forged From: first.
#   "verify"  the claim is proof when the receiving MTA's stamp says so. Needs
#             istota_email_authserv_id; the daemon refuses to load without it.
#   "gate"    the claim is never proof — every self-sent email is held for a
#             yes/no. Noisy by construction.
#
# Legacy booleans still work: false is "off", true is "gate". QUOTE THE VALUE —
# off, on, yes and no are YAML booleans.
istota_email_confirm_sender_match: "off"
# Canary for the assumption above: warns when mail routed on a user's own
# address arrives without a DMARC pass. Monitoring only, never blocks. Set
# warn_on_missing once you know your MTA stamps Authentication-Results — that is
# what catches a move to a provider that does not evaluate DMARC.
istota_email_dmarc_canary: true
istota_email_dmarc_canary_warn_on_missing: false
# Your receiving MTA's authserv-id — the first field of the
# Authentication-Results header it stamps. Blank trusts the topmost header,
# which is the sender's own if your MTA stops stamping. Set it and headers from
# any other authserv-id are discarded, and unstamped mail warns on its own.
istota_email_authserv_id: ""
# The weakest outbound approval policy any user may run. An outgoing email whose
# recipients are not authorized is held as an editable draft; the user approves,
# edits or discards it from web chat or with `!drafts`. One of:
#   off        no holds — every send goes out immediately
#   untrusted  hold unless EVERY recipient (To, Cc, Bcc) is trusted: one of the
#              user's own addresses, a `trusted_email_senders` pattern, or an
#              address trusted at runtime via `!trust`
#   all        hold unless every recipient is one of the user's own addresses
# A floor, not a default: a user may tighten past it, never loosen below it, and
# a user who set nothing follows this value. An invalid value fails the config
# load. `trusted_email_senders` authorizes both directions, so a catch-all
# pattern there turns `untrusted` off entirely.
# QUOTE THE VALUE — unquoted `off` is a YAML boolean and renders as "False",
# which the daemon refuses to load. The play asserts this before templating.
istota_email_outbound_approval_floor: "untrusted"

# Conversation context settings
istota_conversation_enabled: true               # false = no conversation context at all
istota_conversation_lookback_count: 25           # max messages to fetch from DB/cache
istota_conversation_selection_model: "fast"      # role alias (resolves to Haiku by default); operator-overridable via istota_models_aliases
istota_conversation_selection_timeout: 30.0      # timeout for triage model call
istota_conversation_skip_selection_threshold: 3  # skip triage if history <= this count
istota_conversation_use_selection: true           # false = include all fetched messages, no LLM triage
istota_conversation_always_include_recent: 10    # guaranteed recent messages before triage (only when use_selection=true)
istota_conversation_context_truncation: 0        # max chars per bot response in context (0 = unlimited)
istota_conversation_context_recency_hours: 0     # only include older messages within this time window (0 = disabled)
istota_conversation_context_min_messages: 10     # always include at least this many recent messages regardless of age
istota_conversation_previous_tasks_count: 3      # inject N recent scheduled/briefing tasks into context
istota_conversation_talk_context_limit: 100      # max messages to fetch from Talk message cache

# Admin users — full system access (DB, all mount paths, admin-only skills).
# Deployed as /etc/<namespace>/admins, root-owned. An EMPTY list is asymmetric:
# sandbox / skills / commands treat everyone as admin (back-compat), while the
# web admin dashboard treats nobody as admin. List a user_id to grant web admin.
istota_admin_users: []

# Instance-wide skill names excluded from prompt selection. Orthogonal to the
# feature flags: a flag deploys the backend, this keeps the skill doc out of
# prompts. Example: ["browse", "whisper"]
istota_disabled_skills: []

# Experimental feature flags — operator opt-in, not exposed in the web UI and
# not per-user. `uv run istota experimental list` shows the registry; see
# docs/EXPERIMENTAL.md. Example: ["money_tax", "money_wash_sales"]
istota_experimental_features: []

# Users configuration (dict of user_id -> user config). The data model is split:
#   * Profile fields   → user_profiles table (`istota user ensure`)
#   * Folder mounts    → user_resources table (`istota resource ensure`)
#   * Briefings        → briefing_configs table (`istota briefings schedule ensure`)
#   * Tier-2 creds     → encrypted secrets table (`istota secret ensure`, see istota_user_secrets)
#   * Module opt-outs  → `disabled_modules:` list
#
# Example:
# istota_users:
#   alice:
#     display_name: "Alice"
#     email_addresses:
#       - "alice@example.com"
#     # timezone is NOT set here — it is a user preference owned by the web UI /
#     # Nextcloud, and inventory would clobber it on every deploy (ISSUE-102).
#     log_channel: ""               # Talk-room shorthand for the execution log;
#                                   # routing.log below wins over it. Empty lets
#                                   # istota_provision_talk_rooms fill it in.
#     alerts_channel: ""            # Talk room for confirmations and security
#                                   # alerts; empty auto-provisions #alerts.
#     trusted_email_senders:        # skips the inbound gate and the outbound
#       - "*@example.com"           # approval hold. Domain wildcard or exact
#       - "bob@example.net"         # match.
#     quiet_email_senders:          # mail filed silently — no task, no session.
#       - "*@newsletter.example"    # Read back with `email from-senders`.
#     max_foreground_workers: 2     # per-user override (0 or omit = global default)
#     max_background_workers: 1     # per-user override (0 or omit = global default)
#     disabled_skills: []           # per-user skill exclusion list
#     disabled_modules: []          # feeds, money, location
#     # Delivery routing by purpose (reply, alert, log, briefing, notification).
#     # Each maps to an output_target: talk / email / ntfy / all / talk:<room> /
#     # comma list. Listed purposes REPLACE the stored table on each deploy; omit
#     # `routing:` entirely to leave a web-set table alone (ISSUE-102).
#     routing:
#       alert: "ntfy"
#       log: "talk:room123"         # Talk streams live; email/ntfy get one summary
#     default_destination: "talk"   # fallback when no purpose matches; omit to
#                                   # leave the stored value
#     email_reply_routing: "origin+thread"  # origin+thread (default) | origin | thread
#     outbound_approval: "all"      # off | untrusted | all — QUOTE IT, off is a
#                                   # YAML boolean. Omit to follow
#                                   # istota_email_outbound_approval_floor; ""
#                                   # clears a set value back to following it.
#                                   # The floor is a minimum, so a weaker value
#                                   # has no effect.
#     external_turn_display: "collapsed"  # how much of a turn that arrived from
#                                   # outside the room shows inline in web chat:
#                                   # full | collapsed (default) | hidden. A user
#                                   # preference — prefer the web UI.
#     resources:                    # `folder` is the only declarable type: an
#       - type: "folder"            # out-of-workspace path bound into the sandbox.
#         path: "/shared/Projects"
#         name: "Projects"
#         permissions: "write"
#     default_briefings: false      # opt out of the shared [[default_briefings]] set
#     briefing_email_html: false    # false = plain text only (default is HTML plus
#                                   # a plain-text fallback part)
#     timezone_follow_location: true  # set timezone from GPS once settled; needs
#                                   # the location module, notifies on each change
#     briefings:
#       # Blocks-only. `blocks:` seeds ONCE into the user's module DB as an
#       # editable baseline; later web edits are never clobbered. Source `kind` is
#       # rss / email / browse / markets / calendar / todos / reminders / notes;
#       # `render_mode` is synthesis | structured (omit to infer).
#       - name: "world"
#         cron: "0 7 * * *"
#         conversation_token: "room123"
#         output: "talk,email"   # talk / email / ntfy, or a comma list
#         blocks:
#           - title: "World News"
#             directive: "3-5 stories, neutral tone, no markets."
#             render_mode: "synthesis"
#             options: { story_count: 5 }
#             sources:
#               - kind: "rss"
#                 config: { feed_ref: { kind: "category", value: 4 }, lookback_hours: 24 }
#               - kind: "browse"
#                 config: { preset: "ap" }
#           - title: "Markets"
#             render_mode: "structured"
#             sources:
#               - kind: "markets"
#                 config: {}
istota_users: {}

# Per-user encrypted secrets, upserted via `istota secret ensure` into the
# encrypted `secrets` table — never in plaintext on disk. `istota_secret_key`
# must be set. The schema is validated server-side, so a typo in `service` or
# `key` fails the play. Known services / keys:
#
#   karakeep         base_url, api_key
#   monarch          email, password, session_token
#   feeds            tumblr_api_key
#   overland         ingest_token
#   google_workspace (OAuth-only, not provisionable from Ansible)
#
# Example:
# istota_user_secrets:
#   alice:
#     - { service: karakeep, key: base_url,     value: "https://kk.example.com" }
#     - { service: karakeep, key: api_key,      value: "{{ vault_alice_kk_token }}" }
#     - { service: monarch,  key: email,        value: "alice@example.com" }
#     - { service: monarch,  key: password,     value: "{{ vault_alice_monarch_password }}" }
#     - { service: overland, key: ingest_token, value: "{{ vault_alice_overland_token }}" }
#     - { service: feeds,    key: tumblr_api_key, value: "{{ vault_alice_tumblr_api_key }}" }
istota_user_secrets: {}

# Canonical shared briefing set, seeded once into each opted-in user (per-user
# `default_briefings: true`). Same name/cron/output/blocks shape as a per-user
# briefing; later web edits win and re-runs never clobber them. Headlines and
# Markets read the shared blocks below via `shared_block` sources, so the fetch
# and synthesis happens once globally per window rather than per user;
# `max_age_hours` gates freshness. Headlines (needs the headless browser) and
# Calendar (needs CalDAV) are omitted when unavailable. [] seeds nothing.
istota_default_briefings:
  - name: "morning"
    # Display title — the email subject and the archive entry. The run date is
    # appended automatically ("Morning Briefing — Monday, 27 July"). Omit to
    # derive it from `name`.
    title: "Morning Briefing"
    cron: "0 6 * * 1-5"
    output: "email"
    blocks:
      - title: "🌍 Headlines"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "world-headlines", max_age_hours: 6 }
      - title: "📈 Markets"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "markets-summary", max_age_hours: 6 }
      - title: "📅 Calendar"
        render_mode: "structured"
        sources:
          - kind: "calendar"
            config: {}
  - name: "evening"
    title: "Evening Briefing"
    cron: "0 18 * * 1-5"
    output: "email"
    blocks:
      - title: "🌍 Headlines"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "world-headlines", max_age_hours: 6 }
      - title: "📈 Markets"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "markets-summary", max_age_hours: 6 }
      - title: "📅 Calendar"
        render_mode: "structured"
        sources:
          - kind: "calendar"
            config: {}

# Module-owned shared briefing blocks. Generated globally by the scheduler (no
# user, UTC cron) into the shared_kv store and read by per-user briefings via a
# `shared_block` source, collapsing the N-way fetch to one generation. Mirrors
# DEFAULT_SHARED_BLOCKS in config.py; [] disables. Source kinds must be
# user-agnostic: browse / markets / email. These crons are UTC while briefing
# crons are per-user TZ — align them if your windows differ.
istota_briefing_shared_blocks:
  - name: "world-headlines"
    cron: "45 5,17 * * *"
    title: "🌍 Headlines"
    directive: "Synthesize the frontpages into ~8 top world stories, lead with what's new. Neutral wire-service tone."
    render_mode: "synthesis"
    enabled: true
    sources:
      - kind: "browse"
        config: { preset: "ap" }
      - kind: "browse"
        config: { preset: "reuters" }
  - name: "markets-summary"
    cron: "50 5,17 * * *"
    title: "📈 Markets"
    # The markets source already emits a formatted quote table, so it is stored
    # verbatim with no LLM pass. Trusted (pure numbers) so it renders un-wrapped.
    render_mode: "structured"
    enabled: true
    trusted: true
    sources:
      - kind: "markets"
        config: {}

# Timezone shared briefing block crons evaluate in (single operator-chosen zone,
# since blocks are generated globally). Set to the operator's local zone so the
# regeneration windows line up. Maps to [briefings] shared_block_timezone.
istota_briefing_shared_tz: "UTC"

# Inline [anchor](url) links kept per newsletter body in a briefing source. The
# converter already drops unsubscribe / social / web-version chrome; this caps
# what survives, and an over-cap anchor keeps its text and loses the destination.
# 0 = unlimited. Maps to [briefings] newsletter_max_links_per_source.
istota_briefing_newsletter_max_links: 20

# Cap on a single health document (a scan, discharge summary, vaccination
# card) attached to an encounter / condition / immunization. 0 = unlimited,
# for a user whose scanner produces genuinely large files. Maps to
# [health] max_document_bytes.
istota_health_max_document_bytes: 26214400 # 25 MiB

# Whether the portfolio module may look up ticker metadata from a third-party
# quote API when classifying new symbols. The request carries the symbol
# (private financial data) and runs outside the sandbox's CONNECT allowlist. Off
# falls back to offline heuristics. Maps to [money] autoclass_lookup.
istota_money_autoclass_lookup: true

# rclone remote name for Nextcloud
istota_rclone_remote: "nextcloud"

# rclone password (must be pre-obscured with: rclone obscure <password>)
# Generate with: rclone obscure "your-app-password"
istota_rclone_password_obscured: ""

# Nextcloud mount (alternative to rclone CLI)
# When enabled, Nextcloud is mounted at istota_nextcloud_mount_path and istota uses
# direct filesystem access instead of rclone subprocess calls
istota_use_nextcloud_mount: true
istota_nextcloud_mount_path: "/srv/mount/nextcloud/content"

# Money integration is in-process (no separate service). Per-user Monarch
# credentials live in the encrypted secrets table (see istota_user_secrets).
# Workspace layout is auto-derived (data_dir = {workspace}/money, ledgers at
# {data_dir}/ledgers/main.beancount).

# Browser container settings (for web browsing skill)
istota_browser_enabled: false
istota_browser_api_port: 9223
istota_browser_vnc_port: 6080
# Which host address the noVNC console is published on. It serves an interactive
# view of the browser holding your logged-in profile, so it is loopback by
# default; set a VPN or management address to reach it for troubleshooting.
# Anything but loopback requires istota_browser_vnc_password — the role refuses
# to deploy an unauthenticated console on a reachable address (ISSUE-297).
istota_browser_vnc_bind_address: "127.0.0.1"
# Deliberately empty rather than generated: a generated password is one you
# cannot log in with, and generating on upgrade would change the meaning of an
# existing empty setting. Required only when the bind address is not loopback.
istota_browser_vnc_password: ""
istota_browser_vnc_external_url: ""  # e.g. https://vnc.example.com:6080
istota_browser_max_sessions: 3
istota_browser_shm_size: "2gb"
istota_browser_cpu_limit: "{{ ansible_facts['processor_vcpus'] }}"
istota_browser_memory_limit: "3G"

# Browser auto-heal watchdog. A cron.d job restarts the container after
# `debounce` consecutive unhealthy reads, and stops flapping (paging once) after
# `crashloop_max` restarts within `crashloop_window` seconds. A second cron line
# does the daily restart and clears crash-loop state. Debounce counts reads, not
# seconds, so it's independent of the cron cadence.
istota_browser_watchdog_cron: "* * * * *"     # cron schedule for the health check (1-min floor)
istota_browser_watchdog_debounce: 2           # consecutive unhealthy reads before restart
istota_browser_watchdog_crashloop_max: 5      # restarts allowed within the window
istota_browser_watchdog_crashloop_window: 1800  # crash-loop window, seconds (30 min)
istota_browser_watchdog_state_dir: "/var/lib/{{ istota_namespace }}/browser-watchdog"
istota_browser_watchdog_ntfy_url: ""          # optional: full ntfy topic URL for restart/crash-loop alerts
istota_browser_watchdog_alert_email: ""       # optional: email address (requires `mail`) for alerts
istota_browser_daily_restart_cron: "0 5 * * *"  # cron schedule for the proactive daily restart

# The deep liveness probe's CDP arm (ISSUE-384): consecutive CDP failures, with
# Chrome up and answering, that make the container report itself unhealthy so
# the watchdog restarts it. A restart is the only cure for that fault. The
# window is clamped to a 210s floor in the container.
istota_browser_cdp_failure_threshold: 3        # consecutive failures before unhealthy (0 disables)
istota_browser_cdp_failure_window: 900         # seconds; a failure older than this no longer counts

# Devbox container (per-user persistent dev / network-diagnostics environment).
# When enabled, one container per entry in istota_devbox_users is brought up
# via docker-compose. The skill CLI reaches it over the exec transport, on the
# per-user socket the same role provisions; no Docker socket is bound into a
# sandbox any more. `istota_devbox_docker_cli` is for `reset` alone, which
# recreates a container and runs host-side.
istota_devbox_enabled: false
istota_devbox_image: "istota-devbox:latest"
istota_devbox_container_prefix: "devbox-"
istota_devbox_docker_cli: "/usr/bin/docker"
istota_devbox_max_output_bytes: 102400
# Shared by all of one user's concurrent tasks, and the only limit on a build —
# container processes sit in the container's cgroup, not the task's. An
# OOM-killed build comes back as exit 137 / SIGKILL and nothing else reports it.
istota_devbox_mem_limit: "4g"
istota_devbox_cpus: 2
istota_devbox_pids_limit: 512
# How much of the container's log the json-file driver keeps. The default driver
# is unbounded, and the supervisor writes a line per server exit — a server that
# cannot start at all would otherwise fill the disk one line at a time.
istota_devbox_log_max_size: "10m"
istota_devbox_log_max_file: 3
istota_devbox_network_name: "{{ istota_namespace }}-devbox-net"
istota_devbox_network_subnet: "172.30.0.0/24"
# Metadata and link-local blocking. Covers all of 169.254.0.0/16, not just
# 169.254.169.254 — AWS also serves instance DNS, ECS task credentials and NTP
# in that range. Also covers Azure's 168.63.129.16, matched by nothing else here.
istota_devbox_block_metadata: true
# Private-range blocking: drops outbound devbox traffic to 10/8, 172.16/12,
# 192.168/16 and 100.64/10, so a compromised devbox can't pivot to the LAN. The
# last is RFC 6598 CGNAT — the range Tailscale uses — despite the flag's name,
# so this is why a devbox loses reach to a tailnet service. Disable to let the
# devbox reach a colocated service on purpose.
istota_devbox_block_rfc1918: true
# Users whose containers should be created. Each entry is a user_id; the
# container is named "{{ istota_devbox_container_prefix }}{{ user_id }}".
istota_devbox_users: []

# Force a devbox image rebuild and container recreate even when nothing Ansible
# tracks has changed — a hand-modified container, a half-built image, a build
# that failed after its marker was written. Use it as a command-line override
# (`-e istota_devbox_force_recreate=true`); set in inventory it would recreate
# every container on every run. It uses Docker's layer cache, so for a stale
# base image or apt layer build by hand first:
#   docker compose -f docker-compose.devbox.yml build --pull --no-cache
istota_devbox_force_recreate: false

# Devbox credential proxy. One systemd unit per devbox user on a per-user Unix
# socket, bind-mounted into the container at /run/istota-cred. It answers a git
# credential (injected server-side) and the forge token plus URL for the
# container's gh/glab wrapper. Defaults on when devbox is on.
istota_devbox_proxy_enabled: true
istota_devbox_proxy_socket_dir: "/var/run/{{ istota_namespace }}"
# Empty string → audit lines go to the journal only. Set to an absolute
# path to also tail audit lines into a file.
istota_devbox_proxy_audit_log: ""

# The Docker-API allowlist proxy is retired, with every variable that configured
# it. Nothing in a task reaches Docker: project code goes to the container over
# the exec transport, and the devbox skill's `reset` runs host-side. The role
# tears down any surviving units.

# ntfy push notifications are configured per-user via the encrypted secrets
# table (`istota secret ensure -s ntfy ...` or web settings). There is no
# operator-shared ntfy config — each user supplies their own server/topic/auth.

# Location tracking (Overland GPS receiver)
istota_location_enabled: false
istota_webhooks_port: 8765
istota_location_accuracy_threshold_m: 100.0
istota_location_visit_exit_minutes: 5.0
istota_location_reconcile_enabled: true
istota_location_reconcile_lookback_hours: 6.0
istota_location_reconcile_buffer_minutes: 10.0
istota_location_reconcile_grace_minutes: 10.0
istota_location_reconcile_min_pings: 3
istota_location_reconcile_min_dwell_sec: 60

# Authenticated web interface (Nextcloud built-in OAuth2). Set up the client in
# NC Settings → Security → OAuth 2.0 clients, then put the client_id/secret below
# (vault the secret). Redirect URI must match istota_web_oauth2_redirect_uri or
# the derived default https://{istota_hostname}/istota/callback.
istota_web_enabled: true
istota_web_port: 8766

# Restart behaviour, both backstops: the SSE streams observe SIGTERM and end
# themselves, so a restart normally reaches neither deadline. The graceful
# window is uvicorn's drain before it cancels stragglers; the stop timeout is
# the systemd cap behind it.
istota_web_graceful_shutdown_seconds: 5
istota_web_stop_timeout_seconds: 20

istota_web_oauth2_provider: ""           # Public NC URL (what the browser hits), no trailing slash
istota_web_oauth2_client_id: ""
istota_web_oauth2_client_secret: ""
istota_web_oauth2_token_endpoint: ""     # Optional override; defaults derive from oauth2_provider
istota_web_oauth2_userinfo_endpoint: ""  # Optional override
istota_web_oauth2_redirect_uri: ""       # Optional override; defaults to https://{site_hostname}/istota/callback
istota_web_secret_key: ""                # Session signing key (vault). Generate:
                                         #   python3 -c 'import secrets; print(secrets.token_hex(32))'

# User-scoped Nextcloud OAuth token retention (post-as-user Talk mirroring +
# read-state sync). "ephemeral" (default) discards the OAuth pair at login;
# "encrypted" retains it in web_user_tokens, encrypted with the web-only key
# below. NC OAuth2 tokens grant full account access — a deliberate opt-in.
istota_web_token_storage: "ephemeral"
# Byte cap on a profile-picture upload, in KB. Distinct from
# istota_web_chat_max_attachment_mb, which bounds what reaches the process at
# all; this bounds what the avatar endpoint accepts. 0 switches uploads off
# (503); a stored picture is still served.
istota_web_max_avatar_kb: 4096
# Whether the scheduler imports users' Nextcloud profile pictures. Only a custom
# avatar is imported, never Nextcloud's generated letter. Inert on a local
# storage backend. Cadence: istota_scheduler_avatar_import_interval.
istota_web_avatar_import_from_nextcloud: true
# Web-only Fernet key (vault); >=32 chars. Rendered into web-secrets.env and
# loaded only by the web unit, never the scheduler or webhooks units.
istota_web_token_key: ""
# Map background tiles. The default needs no key and no account. "carto" needs
# a free key from https://carto.com/basemaps/apikey/ — without one every tile
# comes back watermarked "API KEY REQUIRED" with a 200 status, so no automated
# check sees it. The key travels in the tile URL to every browser, so it is
# public rather than secret; each user can override it in location settings.
istota_web_map_provider: openfreemap   # openfreemap | carto | osm | custom
istota_web_map_api_key: ""             # carto only
istota_web_map_dark_style: ""          # custom only: MapLibre style URL
istota_web_map_light_style: ""         # custom only
istota_web_map_attribution: ""         # custom only

# Talk→web read-state pull cadence in seconds (0 disables the pull; web→Talk
# push is unaffected). Only active with token storage "encrypted".
istota_web_chat_talk_read_sync_interval: 60
# Live room-event stream (GET /chat/stream): one user-scoped SSE connection per
# open tab carrying every room the user is a member of. Server-side poll cadence
# in ms — deliberately slower than the task stream's 200ms, since these are
# message-level events.
istota_web_chat_room_stream_poll_interval_ms: 1000
# SSE comment-frame cadence, seconds. The vhost allows 3600s reads, but a
# corporate proxy or mobile network drops a silent connection far sooner.
istota_web_chat_room_stream_keepalive_seconds: 20
# Resource guard for a far-behind cursor (a tab resumed from suspend). Tripping
# either cap emits a `gap` frame and the client reloads instead of replaying.
istota_web_chat_room_stream_max_batch: 500
istota_web_chat_room_stream_max_bytes: 2000000
# Per-connection room-metadata diff cadence (rename / model / effort / room
# added or removed elsewhere), seconds. 0 disables it.
istota_web_chat_room_stream_room_check_seconds: 10
# Largest chat attachment, in MB. One number for two consumers: the app's own
# 413, and nginx's client_max_body_size. Never omit it — nginx defaults to 1m
# and answers with an HTML error page the web client cannot parse. The only
# remaining cost of raising it is upload time on a phone connection.
istota_web_chat_max_attachment_mb: 100

# Master key for the encrypted `secrets` table, rendered into secrets.env as
# ISTOTA_SECRET_KEY. Generate with `python3 -c "import secrets; print(secrets.token_hex(32))"`
# and vault it. Empty disables the secrets store (tier-2 creds fall back to TOML extras).
istota_secret_key: ""

# Google Workspace CLI integration (OAuth-based)
istota_google_workspace_enabled: false
istota_google_workspace_client_id: ""
istota_google_workspace_client_secret: ""
# A CEILING, not a request: each user picks their own subset at Settings ->
# Google Workspace, and the connect redirect asks Google only for that. List a
# service only once its API is enabled in your Google Cloud project — a scope
# for a disabled API fails at Google's end.
#
# Read-only by default. To offer read/write, swap in the full counterpart, which
# adds a "Read and write" option to that service's picker:
#   drive.readonly        -> drive
#   gmail.readonly        -> gmail.modify
#   calendar.readonly     -> calendar
#   spreadsheets.readonly -> spreadsheets
#   documents.readonly    -> documents
#   chat.spaces.readonly + chat.messages.readonly -> chat.spaces + chat.messages
# Chat has no default scope, so `chat spaces` needs it added here first. A scope
# outside these pairs (drive.file, gmail.send, openid) gets no picker row and is
# requested unconditionally. Changing the list never rewrites an existing grant.
istota_google_workspace_scopes:
  - "https://www.googleapis.com/auth/drive.readonly"
  - "https://www.googleapis.com/auth/gmail.readonly"
  - "https://www.googleapis.com/auth/calendar.readonly"
  - "https://www.googleapis.com/auth/spreadsheets.readonly"
  - "https://www.googleapis.com/auth/documents.readonly"

# Install all optional Python dependencies (--extra all)
# Set to false to use per-feature flags for fine-grained control
istota_install_all_extras: true

# Whisper audio transcription (faster-whisper CPU, int8)
istota_whisper_enabled: false
istota_whisper_model: "small"              # Model to pre-download (tiny/base/small/medium/large-v3)
istota_whisper_max_model: "small"          # Max model for auto-selection at runtime (WHISPER_MAX_MODEL)

# Memory search settings (hybrid BM25 + vector search)
istota_memory_search_enabled: true
istota_memory_search_auto_index_conversations: true
istota_memory_search_auto_index_memory_files: true
istota_memory_search_auto_recall: false           # BM25 search using task prompt as query
istota_memory_search_auto_recall_limit: 5          # max results for auto-recall
istota_memory_search_recency_half_life_days: 180   # recency decay half-life for recall (0 = off)

# Skills routing has no operator knobs: a skill is either eager (full body in the
# prompt) or in the on-demand menu (a one-line entry the model loads via
# `istota-skill skills show <name>`). A stale `[skills]` block is ignored with a
# load-time warning.

# Learned playbooks (procedural memory) — per-user markdown task procedures the
# sleep cycle distills from successful multi-step tasks, recalled by relevance.
# Off by default.
istota_playbooks_enabled: false
istota_playbooks_recall_limit: 3      # top-K playbooks injected per task
istota_playbooks_min_tool_calls: 4    # a task must use >= this many tools to qualify
istota_playbooks_retention_days: 90   # 0 = keep forever; >0 = age-prune by last-use

# Sleep cycle settings (nightly memory extraction, cron evaluated per-user timezone)
istota_sleep_cycle_enabled: true
istota_sleep_cycle_cron: "0 2 * * *"
istota_sleep_cycle_lookback_hours: 24
istota_sleep_cycle_memory_retention_days: 0  # 0 = unlimited
istota_sleep_cycle_auto_load_dated_days: 3   # auto-load N days of dated memories (0 = disabled)
istota_sleep_cycle_curate_user_memory: false  # nightly USER.md curation (op-based: append/add_heading/remove)
istota_sleep_cycle_curation_log_summary: true  # post one-line summary to user log_channel after applied ops
# KG audit retention is independent of memory_retention_days so default
# deployments still prune the audit table. 0 = unlimited.
istota_sleep_cycle_kg_audit_retention_days: 365

# Channel sleep cycle settings (shared channel memory extraction)
istota_channel_sleep_cycle_enabled: true
istota_channel_sleep_cycle_cron: "0 11 * * *"
istota_channel_sleep_cycle_lookback_hours: 24
istota_channel_sleep_cycle_memory_retention_days: 0  # 0 = unlimited

# Node.js (for developer skill Node.js projects)
istota_nodejs_enabled: false

# Developer skill settings (git + GitLab/GitHub workflows)
# Recommended: dedicated bot accounts with minimal required permissions
istota_developer_enabled: false
# Base directory for repo clones/worktrees. A per-user root: the daemon derives
# {repos_dir}/{user_id}, and that is what every task-scoping mechanism is handed
# (the bwrap bind, the devbox mount, DEVELOPER_REPOS_DIR, the credential scrub).
# The role migrates an existing flat layout down one level, and refuses to move
# a directory holding uncommitted work.
istota_developer_repos_dir: ""
istota_developer_author_credit: ""                # Appended to every commit (e.g., "Co-Authored-By: Name <email>")

# --- Where project code builds and runs ([developer.container]) -------------
#
# There is no variable for this — it is derived from istota_devbox_enabled plus
# istota_developer_enabled plus a non-empty istota_developer_repos_dir. With the
# devbox on, npm/uv/cargo run in the user's devbox over the exec transport; with
# it off they run on the host in the task's bwrap sandbox, where they cannot
# reach a registry off the CONNECT allowlist or install a system package.
# Check the result with `istota doctor --only developer.container`.
# The parent directory holding one socket directory per user. Only the per-user
# subdirectory is ever mounted into a container: mounting the parent would put
# every user's socket in every user's container, which is arbitrary command
# execution against another user's repositories.
istota_developer_container_exec_socket_dir: "/run/{{ istota_namespace }}-exec"
# The client's connect budget, and the only timeout on the connect path.
istota_developer_container_connect_timeout_seconds: 5.0
# Server-side backstop reap for a connection with no traffic in either
# direction. Deliberately longer than most values of task_timeout_minutes, so in
# practice it only fires on an orphan whose task is already gone. Do not lower it
# to something that would kill a long link step.
istota_developer_container_idle_timeout_seconds: 3600
# The commands fronted by a shim. Two absences are deliberate: `python3` cannot
# be added (the sandbox starts its network bridge with it, so a shim breaks
# egress for every developer task), and `make` is left out because shimming a
# driver routes everything beneath it into the container too.
istota_developer_container_shim_commands:
  - npm
  - npx
  - pnpm
  - yarn
  - node
  - uv
  - uvx
  - pip
  - pip3
  - cargo
  - rustc
  - rustup
  - go
  - bundle
  - gem
# The forge CLIs the developer skill drives, from the vendors' releases rather
# than the Debian archive (trixie ships gh 2.46 / glab 1.53, ~50 releases back).
# The same version is named here, in docker/istota/Dockerfile and in
# docker/devbox/Dockerfile — bump all three together;
# tests/test_ansible_forge_cli_install.py holds them equal. Digests are literals
# so a changed artifact shows up as a diff here.
istota_developer_gh_version: "2.98.0"
istota_developer_gh_checksums:
  amd64: "f65a3fa2fa0eb2e97c445ee3f5e087a40aae03b64847f45a8f13805e504535d6"
  arm64: "bbc4ac7964c2a091fd555cd1758d10a7cfcfdc472e405f0b0fb958f05d535cb6"
istota_developer_glab_version: "1.114.0"
istota_developer_glab_checksums:
  amd64: "6df680f88a2a45700d1dd6a08a44a74838473ef3dcc5cb1ad243f4d1fd704ad0"
  arm64: "c2bcb44cc10d849cccb879e687f3b9e102a3415c3d02f0cecfd9ce1442519350"
# gitleaks is the credential half of the pre-commit hook, which refuses an
# unattended agent commit when it cannot run. Fetched from the upstream release
# rather than apt: trixie ships 8.16, below the minimum below. Digests are
# literals so a changed artifact shows up as a diff here.
istota_developer_gitleaks_version: "8.30.1"
istota_developer_gitleaks_checksums:
  amd64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  arm64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
# The release tarballs name amd64 "x64".
istota_developer_gitleaks_release_arch:
  amd64: "x64"
  arm64: "arm64"

# `gitleaks git --staged` replaced `detect` / `protect` in 8.19, and the hook
# calls the new spelling — below this the scan does not run at all and
# `.githooks/pre-commit` refuses every unattended commit (ISSUE-291). The play
# asserts it, resolved through PATH, so it also catches gitleaks missing
# entirely. gh and glab carry no equivalent floor: no honest number could be
# derived from the verbs the skill uses.
istota_developer_gitleaks_min_version: "8.19.0"
# GitLab settings
istota_developer_gitlab_url: "https://gitlab.com"
istota_developer_gitlab_token: ""                 # API token (api + write_repository scope — glab needs api, not read_api)
istota_developer_gitlab_username: ""              # GitLab username for HTTPS auth
istota_developer_gitlab_default_namespace: ""     # Default namespace for short repo names
# `glab mr create --reviewer` resolves by username, so this is the username.
istota_developer_gitlab_reviewer: ""              # GitLab username to assign as MR reviewer
# The same person's numeric user id. Nothing reads it (ISSUE-289) — kept so a
# recorded value is not discarded on the next run, and because the name only
# ever described this one.
istota_developer_gitlab_reviewer_id: ""           # GitLab numeric user id, recorded not consumed
# GitHub settings
istota_developer_github_url: "https://github.com"
istota_developer_github_token: ""                 # Personal access token (repo scope)
istota_developer_github_username: ""              # GitHub username for HTTPS auth (defaults to x-access-token)
istota_developer_github_default_owner: ""         # Default org/user for short repo names
istota_developer_github_reviewer: ""              # GitHub username to request as PR reviewer

# Forge CLI wrapper policy. The real `gh` and `glab` run behind
# src/istota/forge_cli.py, which checks the argv against a baseline policy the
# code owns. These two knobs extend and puncture it. Entries are written as
# they would be typed — "gh repo delete" — and an entry with no binary name
# applies to both CLIs.
istota_developer_forge_cli_extra_denied: []       # Additional verbs to refuse
istota_developer_forge_cli_permit: []             # Baseline entries to turn off — each one removes a guard

# Where the wrapper execs the real binaries, and where the role installs them —
# the task file takes its destination from these same values. /usr/local/bin
# precedes /usr/bin on the default PATH, so ours wins over any apt-installed
# copy, and it reaches the sandbox (/usr is bound read-only). Do not point
# either at a dpkg-owned path such as /usr/bin/gh — apt will fight it.
istota_developer_gh_bin_path: "/usr/local/bin/gh"
istota_developer_glab_bin_path: "/usr/local/bin/glab"

# Worktree reaping (ISSUE-288). Removes only a worktree that is clean, unlocked,
# idle for the retention window, and carrying no commit not already upstream.
# The window also protects concurrently running tasks, whose only evidence of
# being in use is recent activity. Raise it if checkouts are inspected by hand
# days later; `git worktree lock` pins a single one indefinitely.
istota_developer_worktree_reap_enabled: true
istota_developer_worktree_retention_hours: 24.0

# Wall-clock budget for a code-review round. Both agents run concurrently, so
# this is the whole review's clock, and it covers retries and `need_files`
# re-invocations too. Clamped to istota_security_skill_proxy_timeout minus 60s
# — at the default 300s ceiling the largest usable value is 240. Raise the
# ceiling first if you want more.
istota_developer_review_timeout_seconds: 240

# Public hostname for nginx (web UI, webhooks)
istota_hostname: "{{ istota_namespace }}.example.com"

# Static web root served at the domain root (/). Ansible-managed and outside the
# bot: not under istota_home, not writable by the istota user, never bound into
# the sandbox. Content is the operator's; the templated index is written only
# when the file is missing. false keeps `/` returning 404.
istota_web_root_enabled: true
istota_web_root_path: /srv/www/html
istota_web_root_owner: root
# nginx (www-data on Debian) needs read access, not write — group-read is
# enough, so the directory stays root-owned.
istota_web_root_group: www-data
istota_web_root_dir_mode: "0755"
istota_web_root_file_mode: "0644"

# Backup settings
istota_backup_enabled: true
istota_backup_local_dir: "{{ istota_home }}/data/backups"
istota_backup_remote_dir: "{{ istota_nextcloud_mount_path }}/Backups"
# Local snapshots are the fast-restore working set; the copies on the mount are
# the durable tail and keep the longer window. Don't cut the local window to the
# bone — the remote copy is gated on the mount being available and there is no
# back-fill, so a snapshot skipped during an outage has only its local copy.
# These feed `find -mtime +N`, so a value of N retains N+1 days.
istota_backup_db_daily_retention: 5          # delete local dailies older than N days
istota_backup_db_weekly_retention: 3         # delete local weeklies older than N weeks
istota_backup_db_daily_retention_remote: 7   # same, for the copies on the mount
istota_backup_db_weekly_retention_remote: 4
istota_backup_db_cron: "0 */6 * * *"
istota_backup_files_cron: "0 3 * * *"
istota_backup_files_sources:
  - src: "Users"
    dest: "files/Users"
    excludes:
      - "*/shared/**"
  - src: "Channels"
    dest: "files/Channels"
istota_backup_rclone_config: "{{ istota_home }}/.config/rclone/rclone.conf"
istota_backup_rclone_remote: "{{ istota_rclone_remote }}"
istota_backup_rclone_remote_path: "Backups"
istota_backup_log: "/var/log/{{ istota_namespace }}/{{ istota_namespace }}-backup.log"
# Optional command run when a backup run has one or more failures. Empty = no
# alert (backup still exits non-zero + logs the failure). The command receives
# the alert text in the ISTOTA_BACKUP_ALERT_MESSAGE env var, e.g.:
#   'curl -s -H "Title: istota backup failed" -d "$ISTOTA_BACKUP_ALERT_MESSAGE" https://ntfy.example.com/my-topic'
istota_backup_alert_command: ""

# Auto-update settings (poor man's CI)
istota_auto_update_enabled: false
istota_auto_update_cron: "*/5 * * * *"

# How long a play waits for the auto-update cron's lock before giving up, in
# seconds. The cron holds that lock for its whole run and now builds the
# frontend inside it, so a play landing mid-run has to wait rather than pull
# the tree out from under a running build. Generous on purpose: exceeding it
# fails the play, which is the right loud outcome for a run that has been
# holding the lock this long.
istota_update_lock_wait: 900

# Whether to configure rclone automatically
istota_configure_rclone: true

# Security hardening
istota_security_sandbox_enabled: true             # bwrap filesystem isolation per user
# Required wherever sandbox_enabled is true. The databases are masked out of
# the sandbox, so a skill CLI that can't reach the proxy has nothing to read.
istota_security_skill_proxy_enabled: true         # proxy skill CLI calls via Unix socket (credential isolation)
istota_security_skill_proxy_timeout: 300          # timeout for proxied skill commands (seconds)
# Extra RO bind-mounts in the sandbox, for co-located services the agent needs
# to read. Keep entries narrow — a broad path such as /srv/app sits above
# istota_home and exposes the framework and module DBs to every task. The DB
# directories are masked after this list either way.
istota_security_sandbox_ro_paths: []
# FALLBACK root for the package managers' caches (uv, npm, XDG_CACHE_HOME) —
# only for a sandboxed deployment WITHOUT the developer skill. Each user gets
# {root}/{user_id}, bound RW into their sandbox. With the developer skill on the
# daemon derives the cache at {repos_dir}/{user_id}/.package-caches and this key
# is unused, so leave it blank there: a cache on its own mount makes uv copy
# every wheel rather than hardlink it (link(2) compares mounts, not devices).
# Blank with no derivation leaves caches on bwrap's root tmpfs, discarded at
# task exit, so every task re-downloads (ISSUE-305).
# Do not point it at the temp dir or ~/.cache — the daemon refuses both.
istota_security_sandbox_cache_dir: ""
# Bound the package caches (ISSUE-317). Each sweep runs the cheap reclaim
# (uv cache prune, npm cache verify); a cache still over the ceiling afterwards
# is wiped with the tools' own clean verbs. Cadence is
# istota_scheduler_sandbox_cache_sweep_interval; a user with a task in flight is
# skipped. The sweep follows the cache, not the key above, so a blank
# istota_security_sandbox_cache_dir switches nothing off.
istota_security_sandbox_cache_sweep_enabled: true
# Per user, clamped to a 1 GiB floor by the sweeper. One `uv sync --all-extras`
# writes ~1.8 GB, so a ceiling below that wipes a working cache on every sweep.
# Raise it on a bigger volume — a sweep only ever costs a re-download.
istota_security_sandbox_cache_max_gb: 4.0
istota_security_network_enabled: true              # --unshare-net + CONNECT proxy (requires sandbox)
istota_security_network_allow_pypi: true           # add pypi.org + files.pythonhosted.org to allowlist
# Additions to the CONNECT allowlist, as exact "host:port" strings (no
# wildcards). npm and crates.io are already allowed for developer tasks, so this
# is for a private registry, a mirror, or an ecosystem that is not npm, PyPI or
# cargo. Applies to every task, not just developer ones.
istota_security_network_extra_hosts: []
# When true, secrets are loaded from /etc/<namespace>/secrets.env via EnvironmentFile=
# and omitted from config.toml (config.py reads them from env vars)
istota_use_environment_file: true
