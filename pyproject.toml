[project]
name = "istota"
version = "0.40.1"
description = "Personal AI agent integrated with Nextcloud"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26.0",
    "requests>=2.32.0",
    "croniter>=2.0.0",
    "tomli>=2.0.0",
    "cryptography>=42.0",
    # Image pre-shrink for vision attachments runs on every task with an image
    # attachment, so Pillow + HEIC support live in core, not an extra.
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
calendar = [
    "caldav>=1.3.0",
    "icalendar>=5.0.0",
]
email = [
    "imap-tools>=1.0.0",
]
markets = [
    "yfinance>=0.2.0",
]
transcribe = [
    "pytesseract>=0.3.10",
]
memory-search = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
whisper = [
    "faster-whisper>=1.1.0",
    "psutil>=5.9.0",
]
# The WebSocket client for the Talk signaling transport ([talk.signaling]).
# `websockets` rather than `aiohttp`: asyncio-native, small, and one job — and
# `aiohttp` would be a much larger surface pulled in for a client role. The
# import is inside a function, like every other heavy import in `src/`, and
# `enabled = true` without the library is a startup refusal rather than a
# silent fall-through to polling.
#
# One library behaviour is load-bearing and is easy to switch off by mistake:
# the client must answer the server's WebSocket *control* pings. There is no
# application-level ping in this protocol — the signaling server pings every
# 54s with a 60s read deadline — so a client that stops ponging is dropped
# every minute with nothing in the protocol saying why. `websockets` pongs by
# default; `ping_interval=None` disables only the client's own pings and is
# harmless.
# The floor is 14, not the 13 the design named: on 13 the top-level
# `websockets.connect` is still the legacy implementation, with different
# exception types and a different connection object, and it is gone by 15.
# Nothing in the suite exercises the real client, so a 13.x resolution would
# only be discovered in production.
signaling = [
    "websockets>=14.0",
]
location = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "geopy>=2.4",
    # Offline lat/lon -> IANA zone, for following the user's timezone on travel.
    # Offline deliberately: a timezone lookup should not depend on the network
    # or leak the user's position to a third party.
    "timezonefinder>=6.5",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    # Named because `web_app.py` imports it directly rather than through
    # fastapi's re-exports — SessionMiddleware at module scope, and the
    # multipart parser internals a couple of handlers reach into. It arrives as
    # a fastapi transitive either way, so this changes no install; it is here so
    # the manifest says what the code actually does (ISSUE-437).
    "starlette>=0.37.0",
]
money = [
    "click>=8.0",
    "tomli-w>=1.0.0",
    "beancount>=3.0.0",
    "beanquery>=0.1.0",
    "weasyprint>=62.0",
    # Used by the vendored Monarch client (money/_vendor/monarch_client.py)
    # to talk to api.monarch.com over HTTP with cookie-based auth.
    "aiohttp>=3.10",
    # Ticker metadata for portfolio auto-classification. Also in `markets`;
    # listed here because the portfolio module advertises ticker lookup as
    # its primary classification tier, and a `istota[local,money]` install
    # without it has that tier permanently dead.
    "yfinance>=0.2.0",
]
feeds = [
    "feedparser>=6.0.0",
    "bleach>=6.0.0",
    "click>=8.0",
]
garmin = [
    # Native DI OAuth + token persistence; replaced the broken SSO flow
    # in v0.3.x. Pulls in curl_cffi for TLS-fingerprint matching.
    # Requires Python 3.12+ — istota itself still supports 3.11, so the
    # marker keeps 3.11 environments resolvable without the extra.
    "garminconnect>=0.3.3; python_version >= '3.12'",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
# Lean footprint for a local single-user install (`uv tool install 'istota[local]'`):
# core agent + web UI + light pure-Python modules. Heavy modules (money, health,
# location, memory-search/torch, whisper, transcribe) stay opt-in. See
# docs/LOCAL_INSTALL.md. The `claude` CLI is an external prereq for the default brain.
local = [
    "istota[web]",
    "istota[feeds]",
    "istota[calendar]",
    "istota[email]",
    "istota[markets]",
]
all = [
    "istota[calendar]",
    "istota[email]",
    "istota[markets]",
    "istota[transcribe]",
    "istota[memory-search]",
    "istota[whisper]",
    "istota[location]",
    "istota[web]",
    "istota[money]",
    "istota[feeds]",
    "istota[garmin]",
    "istota[signaling]",
]
# What the test suite needs: `all` minus the two heavy ML extras. Not a
# deployment shape — nobody should install `istota[test]` to run the bot; it
# exists so the lean install has one name instead of nine flags repeated across
# scripts/setup.sh, docker/test/Dockerfile and the docs, which is a list that
# drifts.
#
# `memory-search` (torch, sentence-transformers) and `whisper` (faster-whisper,
# av, onnxruntime) are together about 750 MB of the 1.1 GB an `--all-extras`
# venv costs, and the suite does not need them: every heavy import in src/ is
# inside a function, deliberately, so nothing pulls them in at collection. The
# one test that needs one at run time carries the `ml` marker and is deselected
# by default. This matters because the venv is per-worktree and per-container,
# so the difference is paid again on every checkout.
#
# Test-only dependencies do NOT go here — they go in the `dev` group, which uv
# installs by default. See the comment there.
test = [
    "istota[calendar]",
    "istota[email]",
    "istota[markets]",
    "istota[transcribe]",
    "istota[location]",
    "istota[web]",
    "istota[money]",
    "istota[feeds]",
    "istota[garmin]",
    "istota[signaling]",
]

[project.scripts]
istota = "istota.cli:main"
istota-scheduler = "istota.scheduler:main"
istota-skill = "istota.skill_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/istota"]
# Ship the built SvelteKit frontend as package data so the web UI works from a
# non-editable install (no repo checkout). The release build copies web/build →
# src/istota/web_static (gitignored) before `hatch build`; `artifacts` forces
# those otherwise-VCS-excluded files into the wheel. web_app._resolve_static_dir
# falls back to the packaged dir. Absent (dev build without the copy) → no error.
artifacts = ["src/istota/web_static/**"]

# schema.sql lives at the repo root (outside the package dir) but db.init_db
# needs it at runtime, including from a non-editable install with no checkout.
# Force it into the wheel as istota/schema.sql; _resolve_schema_path() reads it
# from there when the source-tree copy is absent.
[tool.hatch.build.targets.wheel.force-include]
"schema.sql" = "istota/schema.sql"

[tool.ruff]
target-version = "py311"
# Declared so a rule that reads it has a number, and so anyone running the
# formatter by hand lands near the tree's own shape (p95 is 80 chars). It is
# not enforced: E501 is not in the rule set below.
line-length = 100
# Three Python programs that ship in the devbox image carry no `.py` suffix,
# because they are on the container's `PATH` and are invoked by name. Ruff
# discovers a file by extension, so without these entries `ruff check
# docker/devbox` walked past the exec server — the process that makes every
# containment decision in the container — and reported the directory clean.
# Named one by one rather than as `scripts/*`: `istota-exec-run` beside them is
# `/bin/sh`, and a glob would hand ruff a shell script to parse as Python.
extend-include = [
    "docker/devbox/scripts/git-credential-istota",
    "docker/devbox/scripts/istota-exec-serve",
    "docker/devbox/scripts/seed-forge-policy",
]

[tool.ruff.lint]
# The default rule set, stated explicitly so it cannot drift with a ruff
# upgrade. Deliberately no formatting-adjacent rules — E1 (indentation),
# E2 (whitespace) and E501 (line length) are all out, because `ruff format`
# is NOT adopted here and the existing hand formatting is the baseline. A
# reformat would rewrite ~525 of 637 files and take `git blame` with it; the
# lint pass is worth having on its own, and the two are separable.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Both files carry module-level setup before their local imports (constants and
# a helper in scheduler.py, route-adjacent import clusters deep in web_app.py).
# Hoisting the imports in a 5,000- and a 6,600-line module is a refactor with
# real circular-import risk, not a lint fix.
"src/istota/scheduler.py" = ["E402"]
"src/istota/web_app.py" = ["E402"]
# Tests legitimately import after a sys.path tweak or a pytest.importorskip.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
# `.` alongside `src`, so `from testbed.stack import Stack` resolves
# without installing the testbed package. It sits beside `src/` rather
# than inside `tests/` because it is not part of the shipped
# application and two repos outside this one consume it.
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services (deselected by default)",
    "live: tests hitting a real model (needs a Claude Code credential or an API key; costs money; deselected by default)",
    "linux: requires a real Linux kernel and a usable bubblewrap (deselected by default; run via scripts/test-linux.sh)",
    "image: builds and runs a Docker image (needs a Docker daemon, run with -n0; deselected by default)",
    "smoke: end-to-end against the lean compose stack (needs a Docker daemon, run with -n0; deselected by default)",
    "full: end-to-end against the full compose stack incl. a real Nextcloud (needs a Docker daemon and minutes to boot, run with -n0; deselected by default)",
    "testbed: in-process wire tests against a real mail server (needs a Docker daemon but no istota image, run with -n0; deselected by default)",
    "ml: needs a heavy ML extra, memory-search (torch) or whisper (faster-whisper); deselected by default, run via `uv sync --all-extras` then `-m ml`",
    "requires_dac: needs POSIX permission bits to constrain the process (skipped as root)",
    "profile: which testbed profile the `stack` fixture should hand this test (default \"base\"; `fresh=True` for a private stack)",
    "script: the turns the scripted model endpoint should replay for this test",
]
addopts = "-m 'not integration and not live and not linux and not image and not smoke and not full and not testbed and not ml' -n auto"
asyncio_mode = "auto"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    # Test-only, and declared here because nothing in
    # `[project.optional-dependencies]` means to provide them. Three of the four
    # used to arrive by accident: jinja2 as an mkdocs (`docs`) and torch
    # (`memory-search`) transitive, psutil as a `whisper` dependency, pyyaml as
    # a `caldav` one. An install without those extras therefore reported
    # collection errors and failures that read as a code regression rather than
    # as a missing package — eight errors and two failures for the jinja2 and
    # psutil pair, eighteen files' worth for pyyaml. python-dotenv is the
    # exception: nothing provided it at all.
    #
    # jinja2: the ansible-template tests render the role's own .j2 files.
    # psutil: `emit_scheduler_stats` collects fds/rss through it (optional at
    #   runtime, imported lazily, warns once when absent), and test_talk_leak
    #   measures fd growth with it.
    # pyyaml: the same failure a third time (ISSUE-437). Eighteen test files
    #   parse the Ansible role's YAML and the compose files with it, while it
    #   was declared nowhere at all and reached the venv only because `caldav`
    #   depends on it and `calendar` is in the `test` extra. It stops arriving
    #   the day either of those changes.
    # python-dotenv: `tests/adversarial/send_t1.py` reads `.env.test` through
    #   it. Undeclared and, unlike the other three, not installed by anything
    #   either — so the script could not run at all.
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # The linter `AGENTS.md` mandates, which until ISSUE-301 was installed
    # nowhere a developer works: not in this group, not in the `test` extra,
    # and `uvx` is not present either, so `ruff check` on a fresh clone was a
    # documented step that could not run. Its only home was a `uv tool install`
    # in `docker/test/Dockerfile`.
    #
    # Pinned exactly, and to the same version that Dockerfile pins. The rule
    # set in `[tool.ruff.lint]` is ruff's defaults for E4/E7/E9/F, so a new
    # release can add a rule to any of them; unpinned, that arrives as a
    # suddenly-dirty tree on whoever synced most recently rather than as a
    # decision. Bump it deliberately, in both places.
    #
    # Note this group is not test-only in practice on one path: the docker
    # image syncs `--no-dev`, but the Ansible role runs a bare `uv sync`, so a
    # bare-metal server already carries pytest, xdist, testmon, jinja2 and
    # psutil, and now ruff — about 10 MB more. Adding `--no-dev` there is the
    # real answer and is a deployment change, not this one.
    "ruff==0.16.4",
]
