# ============================================================================
# Briefing Configuration Notes
# ============================================================================
#
# Briefings are configured per-user in the [[users.NAME.briefings]] array.
# Each briefing has:
#   - name: identifier (e.g., "morning", "evening")
#   - cron: cron expression evaluated in user's timezone
#   - conversation_token: Talk room ID to post briefing to
#   - output: delivery target (talk / email / ntfy, or a comma list)
#   - blocks: the briefing content (the sole content model; see below)
#
# ----------------------------------------------------------------------------
# Config-authored blocks ([[users.NAME.briefings.blocks]])
# ----------------------------------------------------------------------------
#
# Blocks are the full block/source content model. Blocks seed ONCE into the
# user's module DB (per-briefing, seed-once) and are then user-editable in the
# web UI.
#
# Each block:
#   - title: required, non-empty (section header; a titleless block is skipped)
#   - directive: optional synthesis instruction (free text)
#   - render_mode: "synthesis" (LLM writes prose) | "structured" (near-verbatim).
#       Omit to infer: "structured" when the first source kind is markets or
#       calendar, else "synthesis".
#   - options: optional dict passed verbatim to the block (e.g. story_count)
#   - sources: ordered list of 1..N sources, each { kind, config }
#
# Source kinds (kind = ...) and typical config:
#   - rss:      { feed_ref = { kind = "category"|"subscription", value = <id> },
#                 lookback_hours = <int>, limit = <int> }   (needs the Feeds module)
#   - email:    { mode = "shared"|"senders", senders = ["*@x.com"], lookback_hours = <int> }
#   - browse:   { preset = "ap" } or { url = "https://…" }  (needs the browser)
#   - markets:  { futures = [...], indices = [...] } or {}
#   - calendar: {}
#   - todos:    {}
#   - reminders:{}
#   - notes:    {}
# An unknown kind or a block with zero valid sources is skipped with a warning.
#
# To apply one block definition across many users, loop it over `istota_users`
# in the Ansible playbook — there is no instance-wide/subscription model.

# ============================================================================
# TASKS.md File Monitoring (Auto-Discovery)
# ============================================================================
#
# Each user's /Users/{user_id}/ directory is scanned for a TASKS.md file.
# The daemon automatically discovers these files and processes pending tasks.
#
# No per-user configuration needed - just create a TASKS.md file in the
# user's bot-managed directory (created by `istota user init`).
#
# File format:
#   # Tasks
#   - [ ] Send email to john about the meeting tomorrow
#   - [~] Checking calendar for tomorrow's schedule...
#   - [x] 2025-01-26 12:34 | Summarized report | Result: Summary saved to exports/
#   - [!] 2025-01-26 12:35 | Failed task | Error: timeout (attempt 2/3)
#
# Status markers:
#   - [ ] Pending (new, not yet picked up)
#   - [~] In progress (being processed)
#   - [x] Completed successfully
#   - [!] Failed (includes error and retry count)
#
# Email notifications are sent automatically if the user has email_addresses
# configured and email is enabled.
