# Istota configuration

# The name your bot uses in chat, emails, and folder names.
# Change this to whatever you want to call your assistant.
bot_name = "Istota"

# Include emissaries.md (constitutional principles) in system prompts (default: true).
# `istota setup` writes `false` here for local single-user installs.
# emissaries_enabled = true

# =============================================================================
# Model selection — three knobs that interact
# =============================================================================
# `model` + `effort` set the *default* for every task (cron, briefings, talk,
# email, ...). Both fields are read independently.
# `[models.aliases]` (further down) is the operator-visible registry overlaying
# the shipped tier/shortcut defaults.
#
# Resolution chain:
#   1. Per-task overrides — `!model <alias> <prompt>` from Talk wins, both
#      model and effort stored on the task row.
#   2. Otherwise — top-level `model` + `effort` here.
#   3. Otherwise — brain default.
#
# Effort is an ORTHOGONAL :effort modifier on any reference (opus:high,
# smart:low, claude-opus-5:xhigh) — it is no longer baked into an alias name.
# So `model = "opus:high"` here sets BOTH the model and the effort in one token
# (no need to also set `effort =`); the modifier's effort wins.
# =============================================================================

# DEPRECATED (ISSUE-418): top-level `model` / `effort`.
#
# These were the claude_code brain's own defaults living at the root. Because
# they sat here they read as deployment-wide, and the executor treated them as
# one -- filling every request with them whatever brain was about to run, which
# shadowed that brain's own configured default. A room pinned to `native` with
# `[brain.native] model` set still ran the Claude model, against the native
# endpoint, billed per token.
#
# They still load, and are migrated onto `[brain.claude_code]` and
# `[brain.tmux]` with a warning -- both, because those two share the anthropic
# namespace and the same `claude` binary, so the value is valid in either.
# Never onto `[brain.native]`: an Anthropic model id cannot carry to an
# openai_compat endpoint, which is the defect itself.
#
# Set the per-brain keys instead. Each brain's block takes the same values this
# one did:
#   - canonical IDs    "claude-opus-5", "claude-opus-4-7", "claude-sonnet-5"
#   - shortcuts        "opus", "sonnet", "haiku"
#   - role tiers       "smart", "general", "fast", or any custom alias from
#                      [models.aliases] below
#   - any of the above + an optional :effort modifier ("opus:high")
# Bare shortcuts ("opus", "sonnet") float to the current latest version each
# release; canonical IDs are immutable. Pin to a versioned ID for stability.
# model = "claude-opus-5"
# effort = "high"

# Use config/system-prompt.md instead of Claude Code's default system prompt.
# The custom prompt is minimal, focused on tool usage and working practices.
# The CLI opens that file from inside the sandbox, so it is bind-mounted there
# read-only — the only file in this directory that is (config.toml is not).
# custom_system_prompt = true

# Database path (relative to working directory or absolute)
db_path = "data/istota.db"

# Local-disk root for per-user module SQLite DBs (feeds/health/location/money).
# These MUST live on local disk, NOT the Nextcloud mount: WAL's mmap'd -shm file
# SIGBUSes the process on the rclone FUSE mount, so they'd be stuck on the
# slower DELETE journal mode (no reader/writer concurrency). User-facing files
# (health uploads, money ledgers, feeds exports) stay on the mount; only the
# .db relocates here. A path under nextcloud_mount_path is refused at runtime.
module_data_dir = "data/modules"

# =============================================================================
# File Access Configuration
# =============================================================================
# Choose ONE of the following options:

# Option 1: rclone CLI (default, works without systemd mount)
# Uses subprocess calls to rclone for each file operation
rclone_remote = "nextcloud"

# Option 2: Local mount (faster, requires mount-nextcloud.service)
# Uncomment to enable - all Nextcloud files accessible as local paths
# nextcloud_mount_path = "/srv/mount/nextcloud/content"

# Path to skills directory (individual skill files loaded selectively)
skills_dir = "config/skills"

# Skills to exclude from selection (instance-wide)
# disabled_skills = ["browse", "whisper"]

# Temporary directory for task execution
temp_dir = "/tmp/istota"

# How much recalled memory a task prompt may carry. Both are deployment-wide
# budgets applied after retrieval has already picked what is most relevant, so
# lowering them drops the weakest matches rather than switching recall off.
# `max_memory_chars` caps the total characters of memory text; 0 is unlimited.
# A per-user `[users.X] max_chars` of 0 means "share this budget".
# max_memory_chars = 0
# `max_knowledge_facts` caps how many knowledge-graph facts a single prompt
# carries; 0 is unlimited.
# max_knowledge_facts = 50

# Experimental feature flags — operator opt-in for rough features that ship
# in the tree but are off by default. See docs/EXPERIMENTAL.md for the
# registry and graduation policy. Run `uv run istota experimental list` to
# see what's gateable on this build. Unknown names log a warning at
# startup. Not exposed in the web UI, not per-user.
[experimental]
# features = ["money_tax", "money_wash_sales"]
features = []

# Brain — selects the model-invocation backend. Three kinds coexist behind the
# same protocol (src/istota/brain/), so swapping backends doesn't touch executor
# orchestration (memory, skills, sandbox, etc.):
#   "claude_code" (default) — wraps the headless `claude -p` CLI subprocess.
#   "native"                — istota's own in-process agent loop against an
#                             OpenAI-compatible (or Claude-CLI) provider.
#   "tmux_claude"           — drives the interactive `claude` TUI in a detached
#                             tmux session (keeps traffic on subscription
#                             billing). Full instance switch, with its own
#                             launch circuit breaker. Set fallback below to
#                             reroute an unavailable tmux primary.
# [brain]
# kind = "claude_code"
#
# Availability failover: when the primary brain is unavailable (subscription
# usage limit / missing binary / tmux launch failure), run the task on the
# fallback brain with that brain's own [brain.native] / [brain.tmux] settings.
# Motivating case: a claude_code subscription hitting its usage limit, failing
# over to a metered native endpoint. A portable role tier (fast/general/smart)
# carries across the provider boundary; a provider-specific model pin drops to
# the fallback brain's own default (logged + a visible note in the reply).
# Single level only. "" = no fallback, for every brain kind — a tmux_claude
# primary needs fallback = "claude_code" spelled out here to get one. A value
# equal to the kind a task runs on is no fallback for that task, so naming
# claude_code here with a source_type_overrides entry routing to tmux gives the
# routed tasks failover and leaves the rest alone. Once the
# primary reports a persistent unavailability, subsequent tasks skip it for
# fallback_cooldown_seconds; a successful primary probe closes the cooldown early.
# On a usage limit against a Claude subscription the window ends at the quota's
# own reset instead, so fallback_cooldown_seconds is the ceiling rather than the
# duration (floor 60s).
# fallback = ""                       # "" | "claude_code" | "native" | "tmux_claude"
# fallback_on_transient = true        # also reroute a persistent transient_api_error
#                                     # (429 / 5xx / 529 / network) after the primary's
#                                     # own retries are exhausted. Set false to opt out.
# fallback_cooldown_seconds = 900     # skip an unavailable primary this long; 0 disables stickiness
#
# Which brain kinds a room may pin for itself, and which a scheduled job may
# pin with `brain` in CRON.md. The name is narrower than the setting: one list
# bounds every pin written outside this file. Empty (the default) means none
# may, so the feature is inert until you name kinds here. A gate rather than a
# preference: brain kind decides which process holds the agent loop, what tool
# set it registers and which sandbox profile is built, so it is not something an
# upgrade should switch on. Both deployment shapes rewrite this file from
# scratch, so set it through the deployment rather than by editing the rendered
# copy: `istota_brain_room_selectable` on Ansible,
# `ISTOTA_BRAIN_ROOM_SELECTABLE` (comma-separated) on Docker. Writing a room's
# brain, or a job's, is admin-only on top of this — CRON.md is model-writable
# through the `schedules` skill, so a non-admin's `brain` is dropped at sync
# with a warning and the job runs the configured answer. Whatever pins a brain
# runs that brain or fails saying why — the fallback above does not apply to
# it, which is what makes the pin mean what it says. A name here that is not a
# buildable kind is dropped with a warning and never offered. Listing a kind
# also widens the doctor checks for it (`claude` on PATH, tmux, a native API
# key), whether or not anything has selected it.
# room_selectable = []                # e.g. ["claude_code", "native"]
#
# Native-brain settings (only used when kind = "native", or via a routing
# override below). The API key stays out of this file — set it via the
# ISTOTA_BRAIN_NATIVE_API_KEY env override.
# [brain.native]
# provider = "openai_compat"                 # only provider currently
# model = "claude-sonnet-4-6"                # explicit id for openai_compat
# effort = ""                                # default effort: low/medium/high/xhigh/max.
#                                            #   Sent as `reasoning_effort` only to a
#                                            #   thinking-capable model; xhigh/max fold
#                                            #   to high over the compat endpoint. Empty
#                                            #   = no reasoning_effort field. Per-task
#                                            #   effort (e.g. !model opus:high) overrides.
# base_url = "https://api.anthropic.com/v1"  # any OpenAI-compatible endpoint
# context_window = 0                         # 0 = resolve from the live-fetched
#                                            #   OpenRouter catalog (below) or the
#                                            #   conservative 200k default. A NON-
#                                            #   OpenRouter native endpoint (local
#                                            #   vLLM/Ollama) SHOULD set its real
#                                            #   window here (or a model_overrides
#                                            #   entry) — nothing fetches it.
# max_turns = 100                            # hard cap on assistant turns/task
# max_tokens = 16384                         # per-completion output cap
# compaction_reserve_tokens = 0              # headroom compaction leaves free below the context
#                                            #   window. 0 derives it from the window, which is
#                                            #   what a small-window local model wants — the
#                                            #   fixed constants are sized for an Anthropic
#                                            #   window and would compact it constantly.
# compaction_keep_recent_tokens = 0          # how much of the tail compaction keeps verbatim
#                                            #   rather than summarising. 0 derives it the same
#                                            #   way. The two are read independently — setting
#                                            #   one and leaving the other at 0 derives only
#                                            #   the one left unset.
# model_catalog_fetch = true                 # when base_url is OpenRouter, fetch its
#                                            #   public model list once/process for real
#                                            #   window / capabilities / prices (self-
#                                            #   updating; disk-cached). No effect for a
#                                            #   non-OpenRouter endpoint. Fetch failure is
#                                            #   never fatal (stale cache → 200k default).
# model_catalog_cache_ttl_hours = 24         # disk-cache freshness for the fetch above
# turn_budget_nudge = true                   # pace the model as it nears max_turns: inject an
#                                            #   environment notice so a long tool-bearing run
#                                            #   delivers a partial answer instead of getting
#                                            #   capped mid-plan. Off for models that mishandle
#                                            #   meta-instructions.
# turn_budget_nudge_early_percent = 50       # first (~halfway) reminder fires at this % of the cap
# turn_budget_nudge_remaining = [15, 5]      # escalating late fires at these absolute steps-remaining
#                                            #   Both ladders also run against the wall clock: the
#                                            #   loop estimates the turns the remaining time has
#                                            #   room for and uses whichever budget is scarcer, so
#                                            #   the notices stay reachable on a slow brain.
# soft_deadline_percent = 90                 # stop the loop at this % of scheduler.task_timeout_
#                                            #   minutes, on a stop that keeps the model's partial
#                                            #   work. The hard clock discards it; max_turns
#                                            #   delivers it, and on a slow brain the clock is what
#                                            #   arrives first. The remaining slack still covers a
#                                            #   turn that hangs. 0 or >= 100 disables.
# prompt_caching = true                      # cache_control breakpoints. Omit to use the
#                                            #   default: ON for api.anthropic.com,
#                                            #   OFF for any other endpoint. Set explicitly
#                                            #   to force either way (a plain-OpenAI / local
#                                            #   endpoint that rejects cache_control needs
#                                            #   `false`).
#
# Daemon-side WebFetch tool for the native harness. It is the one tool that
# runs OUTSIDE the sandbox's network namespace, in the daemon's own, so the
# CONNECT allowlist under [security.network] does not gate it. What stands in
# for that: it carries no credentials and no cookies (`trust_env = False`),
# every resolved IP is checked against the private/reserved blocklist on the
# first request and on every redirect hop, the connection is pinned to the IP
# that was validated (so a second DNS answer cannot redirect it), it is GET and
# text only, and what comes back is wrapped in an untrusted-content delimiter.
#
# ADMIN-ONLY WHATEVER THIS BLOCK SAYS. `build_allowed_tools` withholds the tool
# from a non-admin and the native brain filters its tool set by that list, so
# `enabled = true` offers it to admins alone — a fetch from the daemon's
# network namespace is egress the same user's claude_code task does not have.
# `enabled = false` withdraws it from everyone.
# [brain.native.web_fetch]
# enabled = true
# timeout_seconds = 20.0          # total wall clock per fetch
# max_bytes = 5000000             # response body cap, enforced while streaming
# max_content_chars = 100000      # extracted text handed to the model
# max_redirects = 5               # hops before giving up; each one is re-validated
# allow_http = false              # true permits cleartext http://. Leave off:
#                                 #   the fetch is unauthenticated but the *content*
#                                 #   reaches the model, and cleartext is content
#                                 #   anyone on the path can choose.
# allowed_ports = [80, 443]       # a port not listed is refused before any connect
# user_agent = "IstotaBot/1.0"
# allow_hosts = []                # non-empty makes this an allowlist (suffix match):
#                                 #   nothing else is fetchable at all
# block_hosts = []                # always refused (suffix match), allowlist or not
# extra_blocked_cidrs = []        # operator additions to the private/reserved
#                                 #   blocklist — a metadata endpoint or an internal
#                                 #   range the shipped list does not know about
# require_url_provenance = false  # true limits fetches to URLs that appeared in the
#                                 #   task itself, so a model cannot compose one from
#                                 #   data it read. For a deployment ingesting content
#                                 #   it does not trust.
#
# Per-attempt transcript of a native-brain run: one append-only JSONL file per
# task attempt holding the assembled prompt, every assistant turn with its
# thinking and tool calls, every tool result, every compaction and steer, and a
# terminal record. `tasks.execution_trace` keeps tool *labels* and no output at
# all, so this is the only artifact that answers "what did the model actually
# see and do" for a run that already finished. Native-only — claude_code and
# tmux_claude already get a transcript from the `claude` CLI.
#
# The files hold the assembled prompt, which holds USER.md, and raw tool
# output, which can hold whatever a Bash call printed. They are written 0600
# behind a 0700 per-user directory, on local disk, bound into no sandbox, and
# nothing copies them off the host. An operator who cannot accept a credential
# a task `cat`ed living there for the retention window sets `enabled = false`.
#
# DOCKER: these knobs are deliberately not operator-settable on the Docker
# shape (the Ansible role does have a variable for each). There is no
# ISTOTA_BRAIN_NATIVE_SESSION_LOG_* variable in
# docker/istota/render-config.sh or docker/docker-compose.yml — a Docker
# deployment runs the shipped defaults. render-config.sh writes
# db_path = "/data/db/istota.db", so the directory resolves to /data/db/logs on
# the istota_data volume, beside the framework database and behind the same
# sandbox mask. Adding a knob means adding it to *both* files; a variable the
# generator reads and compose never passes is silently ignored, which is the
# documented defect class (ISTOTA_EMAIL_AUTHSERV_ID).
# [brain.native.session_log]
# enabled = true                  # false = no new files; retention still sweeps existing ones
# dir = ""                        # "" resolves to {db_path.parent}/logs — local disk,
#                                 #   beside istota.db / modules/ / backups/, and behind
#                                 #   the sandbox's database mask where that mask applies.
#                                 #   A value set here is used AS GIVEN (no ~ expansion,
#                                 #   no resolving against a base), so WRITE AN ABSOLUTE
#                                 #   PATH: a relative one follows each process's own
#                                 #   working directory, and the daemon, the sweep and an
#                                 #   `istota` command run from a shell need not share it.
#                                 #   Pointing it outside db_path.parent gets a WARN from
#                                 #   `istota doctor`. "/" and other values naming no
#                                 #   directory of their own are refused (the sweep deletes
#                                 #   under whatever this resolves to).
#                                 #   OTHERWISE THIS VALUE IS TRUSTED, the way
#                                 #   [security] sandbox_cache_dir is: there is no
#                                 #   containment rule bounding it against an ancestor, so
#                                 #   the retention sweep below treats every subdirectory of
#                                 #   whatever you write here as a user's and unlinks the
#                                 #   *.jsonl files under it. Point it at a directory istota
#                                 #   owns. Nothing the model writes can reach this setting;
#                                 #   what bounds the damage of a mis-set one is the shape of
#                                 #   the walk: only *.jsonl, only under a first-level
#                                 #   subdirectory (never a file at this directory's own
#                                 #   level) but at ANY depth within one, never through a
#                                 #   symlink, and rmdir only on a directory the sweep
#                                 #   itself emptied.
# retention_days = 14             # age rule, for privacy. Deliberately longer than
#                                 #   [scheduler] task_retention_days — the log's value is
#                                 #   that it outlives the task row. 0 = keep for ever by
#                                 #   age; the size ceiling below still applies.
# max_total_gb = 2.0              # size ceiling, for the disk, across EVERY user summed —
#                                 #   the thing being protected is a filesystem, and this
#                                 #   one also holds istota.db and every module DB. Lean on
#                                 #   purpose: on a busy deployment the ceiling, not
#                                 #   retention_days, is what binds, and `istota doctor`
#                                 #   warns when the last sweep evicted by size. Eviction is
#                                 #   largest-user-first, then oldest within that user, so a
#                                 #   noisy neighbour cannot clear a quiet user's history.
#                                 #   Clamped to a 0.5 floor. 0 = no ceiling; the age rule
#                                 #   still applies.
# max_content_chars = 32768       # per text/thinking block; over the cap the block keeps its
#                                 #   head and its tail (a build log's tail is where the
#                                 #   error is) and records the real length. NOTE 0 here
#                                 #   means NO CAP, not "off" as it does on the two limits
#                                 #   above — an uncapped block is one raw tool result of
#                                 #   whatever size, which is what the caps exist to bound.
# max_args_chars = 8192           # per tool-call arguments object; over the cap it becomes an
#                                 #   honest marker rather than a truncated JSON fragment.
#                                 #   0 = no cap, as above.
# include_thinking = true         # reasoning traces in the written log. The most useful
#                                 #   record for debugging a wrong answer, and the bulkiest.
#                                 #   Independent of `istota-skill tasks transcript`, where
#                                 #   thinking stays off unless asked for.
#
# Tmux-driven interactive-TUI brain (only used when kind = "tmux_claude", or via
# a routing override below). All fields default in code to the prototype's pinned
# values, so an empty/absent block is behavioral parity. The marker lists are
# pane-text heuristics pinned to a claude CLI version — a CLI reword that breaks
# readiness detection is a config hotfix (override the relevant marker), not a
# code release.
# [brain.tmux]
# model = "claude-opus-5"           # this brain's own default model (ISSUE-418);
# effort = "high"                   #   same values as [brain.claude_code] above,
#                                   #   same anthropic namespace, same binary.
#                                   #   "" = the CLI's own default
# fallback_trip_threshold = 5       # consecutive launch failures before the circuit opens
# fallback_cooldown_seconds = 300   # how long the circuit stays open (routes to the
#                                   # configured [brain] fallback, if any)
# ready_timeout_seconds = 30        # REPL-ready deadline
# tmux_command_timeout = 10         # per-tmux-subprocess timeout
# cli_version_pin = "2.1.168"       # supported claude CLI; mismatch logs a WARNING
# ready_markers = ["bypass permissions on", "? for shortcuts", "for shortcuts"]
# trust_markers = ["trust this folder", "Is this a project you"]
# theme_markers = ["Choose the text style", "run /theme"]   # first-run theme picker
# bypass_warning_marker = "Bypass Permissions mode"
# bypass_accept_marker = "Yes, I accept"
# error_markers = ["API Error", "session limit reached", "Context low"]
# usage_limit_markers = ["session limit reached", "usage limit reached", "Claude usage limit"]
#                                   # pane substrings → stop_reason=usage_limit → the
#                                   # configured [brain] fallback, if any
#
# Headless `claude -p` brain settings. The brain's model selection still comes
# from [brain] and [models]; this block is the subscription usage poll only, and
# it is read whatever `kind` is set to — a native primary with a claude_code
# fallback burns the same plan. All fields default in code, so an absent block
# is the shipping behaviour.
# [brain.claude_code]
# This brain's own default model and effort, used when nothing pins one for the
# task (ISSUE-418). Read whatever `kind` is set to -- a native primary with a
# claude_code fallback, or a source_type_overrides entry, routes here.
# Empty or omitted = the CLI's own default.
# model = "claude-opus-5"
# effort = "high"
#
# Poll https://api.anthropic.com/api/oauth/usage for plan utilization and show it
# on /admin and in `istota doctor`. Read-only: the credential is never written or
# refreshed. Off = the doctor check SKIPs and the admin card is absent; there is
# no reading to draw, and a permanent "unavailable" note names nothing to do.
# subscription_usage = true
# subscription_usage_cache_ttl_seconds = 1800    # one deployment-wide fetch per this window,
#                                                #   and the floor on the retry after a failure.
#                                                #   The shortest window reported is five hours,
#                                                #   so polling faster buys no accuracy and the
#                                                #   endpoint rate-limits a deployment that does.
#                                                #   Floored at 1 (0 would fetch on every read).
# subscription_usage_timeout_seconds = 10        # matches doctor.PROBE_TIMEOUT; floored at 1
# subscription_usage_warn_percent = 80.0         # doctor WARNs, the tile turns amber
# subscription_usage_high_percent = 95.0         # the tile turns red; still a WARN, never a FAIL
#                                                #   both clamp to [0, 100]; warn above high is
#                                                #   lowered to high (logged) — an inverted pair
#                                                #   leaves no amber band
# subscription_usage_stale_after_seconds = 3600  # a stale-cache reading older than this is
#                                                #   reported SKIP, not as a current number
#
# Per-source-type brain routing (gradual rollout): map a task's source_type to
# a brain kind, overriding `kind` for matching tasks. Lets cron/heartbeat run on
# the native brain while interactive talk/email stays on claude_code. Unknown
# kinds are ignored (logged), never wedging a task.
# [brain.source_type_overrides]
# scheduled = "native"
# heartbeat = "native"

# ============================================================================
# Security Hardening
# ============================================================================
# Claude subprocess runs with a clean minimal environment and --allowedTools
# whitelist. Credentials are injected per-task and optionally routed through
# the skill proxy (enabled by default) for credential isolation.
# Secrets can be provided via env vars (e.g. from systemd EnvironmentFile=).
# Naming convention: ISTOTA_<SECTION>_<FIELD>, matching the config dataclass path.
#   ISTOTA_NEXTCLOUD_APP_PASSWORD, ISTOTA_EMAIL_IMAP_PASSWORD, ISTOTA_EMAIL_SMTP_PASSWORD,
#   ISTOTA_DEVELOPER_GITLAB_TOKEN, ISTOTA_DEVELOPER_GITHUB_TOKEN

# [security]
# sandbox_enabled = true           # bwrap filesystem isolation per user (Linux only)
# skill_proxy_enabled = true       # proxy skill CLI calls via Unix socket (credential isolation).
#                                  # Required wherever sandbox_enabled is true, for two reasons.
#                                  # Off, every configured service credential stays in the task
#                                  # environment where the model can read it from inside the
#                                  # sandbox, instead of being injected per call. And the databases
#                                  # are masked out of the sandbox, so a skill CLI that can't reach
#                                  # the proxy has nothing to read and refuses rather than guessing.
# skill_proxy_timeout = 300        # timeout for proxied skill commands (seconds).
#                                  # Capped at 570 by what the sandboxed client waits;
#                                  # see [security.skill_proxy_timeouts] below to give
#                                  # one skill a different budget.
# passthrough_env_vars = ["LANG", "LC_ALL", "LC_CTYPE", "TZ"]
# sandbox_ro_paths = []            # extra RO bind-mounts in sandbox, for co-located services the
#                                  # agent needs to read. Keep entries narrow — a broad path sweeps
#                                  # in whatever lives under it. (The DB directories are masked
#                                  # after this list is applied, so they stay unreachable either way.)
# sandbox_cache_dir = ""           # root of a disk-backed directory for the package managers'
#                                  # caches. Each user gets {root}/{user_id}, bound RW into
#                                  # their sandbox, with UV_CACHE_DIR, XDG_CACHE_HOME and
#                                  # npm_config_cache pointed at it. Empty (the default) leaves
#                                  # them on bwrap's own root tmpfs — RAM the host cannot
#                                  # attribute, discarded at task exit, so every task downloads
#                                  # again. Put it under developer.repos_dir when that is set:
#                                  # uv hardlinks out of its cache and link(2) fails across a
#                                  # mount boundary, so a cache elsewhere costs every worktree a
#                                  # full copy. It is ignored, with a warning, when it is
#                                  # relative, missing, unwritable, under a database directory,
#                                  # or at or ABOVE anything the sandbox already mounts — a bind
#                                  # above an earlier mount would cover it, so do not point this
#                                  # at temp_dir, ~/.cache, ~/.local, or repos_dir itself.
# sandbox_cache_sweep_enabled = true  # bound what that directory grows to. Moving the caches
#                                  # onto disk is what makes them persist, and nothing else
#                                  # prunes them. Every sweep runs the package managers' own
#                                  # cheap reclaim (uv cache prune, npm cache verify); a
#                                  # per-user cache still over the ceiling afterwards is wiped
#                                  # with their clean verbs. A user with a task in flight is
#                                  # skipped rather than raced. Cadence is
#                                  # [scheduler] sandbox_cache_sweep_interval; inert while
#                                  # sandbox_cache_dir is empty.
# sandbox_cache_max_gb = 10.0      # the ceiling, per user. Bytes rather than an age window
#                                  # because one `uv sync --all-extras` writes about 1.8 GB in
#                                  # a single command, which blows any sane window at once.
#                                  # Clamped to a 1 GiB floor: below that the ceiling is under
#                                  # one dependency resolution's working set, so every sweep
#                                  # would wipe a cache that is doing its job.

# Per-skill overrides of skill_proxy_timeout, applied instead of the global for
# the skills named. An entry narrows as readily as it widens. Everything here is
# bounded at 570s by the fixed wait the sandboxed client arms before it sends,
# which is not configurable — and that bound applies to skill_proxy_timeout
# above as well.
#
# code_review already has a 540s ceiling of its own without an entry here: it is
# the only skill that drives model calls, and raising the global to suit it
# would hand the same minutes to every other skill. That value is in the code
# rather than in this table's default, because a table an operator writes
# *replaces* the default rather than merging with it — so shipping the entry
# here would mean setting some other skill silently took the review's ceiling
# back to the global. Naming code_review here still overrides it.
#
# [security.skill_proxy_timeouts]
# browse = 90

# [security.network]
# enabled = true                   # --unshare-net + CONNECT proxy (requires sandbox)
# allow_pypi = true                # add pypi.org + files.pythonhosted.org to allowlist
# extra_hosts = []                 # operator-specific additions (e.g. ["registry.example.com:443"])
#
# The public npm and crates.io registries are already added for a task that is
# authorized for the `developer` skill, so an install inside a worktree needs
# nothing here. `extra_hosts` is for what those defaults cannot cover: a
# private registry, a company mirror, or an ecosystem that is not npm, PyPI or
# cargo. Note it applies to *every* task rather than only developer ones —
# there is no per-skill operator list. Matching is exact `host:port` with no
# wildcards, so a missing entry fails at the boundary and reads as a broken
# install. See docs/deployment/security.md for what is deliberately uncovered.

[nextcloud]
# Nextcloud server URL. This also drives storage vocabulary: when set, the bot
# describes files as Nextcloud (mount/rclone); when blank (the local/standalone
# shape), it describes "your workspace" as a plain local folder instead.
url = "https://nextcloud.example.com"
# Bot's Nextcloud username
username = "istota"
# App password (generate in Nextcloud: Settings > Security > Devices & sessions)
# Note: CalDAV settings are derived from these values automatically
# CalDAV URL = {url}/remote.php/dav, using same username/app_password
app_password = "xxxxx-xxxxx-xxxxx-xxxxx-xxxxx"
# Default expiry applied by `nextcloud share link`. A handed-out link that never
# expires is the thing worth avoiding; 0 opts out of a default entirely.
share_default_expire_days = 14
# Where the bot's storage root sits inside its own Nextcloud file tree. Leave
# empty for the rclone-mount deploy, where they are the same directory. Set it
# to the mount point when the storage root reaches Nextcloud as an external
# storage mount (the Docker stack sets "Shared Files"): every DAV and OCS path
# the bot sends is prefixed with it, while paths on disk are unaffected.
dav_prefix = ""
# Share the bot workspace back to the user over OCS on every boot. Leave true
# unless something else already puts that directory in the user's file tree —
# the Docker stack mounts it there at provisioning and sets this false, so the
# user is not handed the same directory twice.
auto_share_bot_dir = true

# ============================================================================
# CalDAV (only when the calendar is not the Nextcloud above)
# ============================================================================
# Calendar normally derives from [nextcloud]: the URL becomes
# {url}/remote.php/dav and the username and app password are reused. This block
# overrides that derivation field by field, and it exists for the shape with no
# Nextcloud at all — a local single-user install pointing calendar at Radicale,
# Fastmail or Google. On a Nextcloud deployment you want it only when the
# calendar genuinely lives elsewhere.
#
# SET ALL OF IT OR NONE OF IT. The three `Config.caldav_*` properties fall back
# to [nextcloud] one field at a time, not as a group, so a half-set block does
# not read as "override off" — it mixes. A url with no password names a foreign
# host and then hands that host the Nextcloud app password. A password with no
# url authenticates to Nextcloud's own DAV endpoint with the wrong secret.
# `istota setup` refuses the first pairing outright and the Ansible template
# renders nothing unless it has both; this file is the one place you can write
# the broken shape by hand.
#
# DOCKER: there is no ISTOTA_CALDAV_* variable in
# docker/istota/render-config.sh or docker/docker-compose.yml, and that shape
# re-renders config.toml on every boot — so a block added here by hand is gone
# at the next restart. On Docker the calendar is the bundled Nextcloud's.
#
# `istota setup` offers this and writes the url and username here, with the
# password in the sibling istota.env. The password has an
# ISTOTA_CALDAV_PASSWORD environment override, so on any shape that already has
# an env file it need not be in this file at all — and where the file is
# generated, it is not.
# [caldav]
# url = "https://dav.example.com"
# username = "you@example.com"
# password = ""                  # prefer ISTOTA_CALDAV_PASSWORD in the env file

[talk]
# Enable Talk polling (requires istota user to be added to conversations)
enabled = true
# Bot's Nextcloud username (to filter its own messages)
bot_username = "istota"

[talk.signaling]
# Receive Talk messages over Nextcloud's standalone signaling server (the
# high-performance backend) instead of polling for them. Off by default.
#
# What it needs, and what happens without it: the HPB has to be registered with
# Talk already, which you can check with `occ talk:signaling:list`. If it is
# not, istota **refuses to boot** rather than quietly polling — an operator who
# believes push is live and is actually being polled for is worse off than one
# whose daemon did not start. The same refusal covers the `websockets` library
# being absent; install it with the `signaling` extra.
#
# There is no secret here, and that is the design. istota connects as its own
# Nextcloud user, so the server URL, the hello token and the per-room session
# id are all minted on demand by Talk from calls the bot account can already
# make. The alternative the protocol offers is an internal client holding the
# signaling server's shared secret, which can join any room on the instance;
# that is why it is not used.
#
# Two consequences worth knowing before switching it on. istota holds an active
# Talk session in every room it watches, around the clock, so it shows as
# present to everyone else in those rooms — it is not in a call, and it never
# joins one. And a second daemon pointed at the same Nextcloud opens its own
# sessions and receives every event; duplicate work is prevented by the read
# cursor rather than by the transport.
enabled = false
# HPB base URL. Empty is the normal case and means "use whatever Talk
# advertises". Set it only where the daemon has to reach the server by a
# different route than the one browsers are given.
url = ""
# Seconds between room reconciliations. This pass is also the safety net: it
# compares every room's latest message id against the stored cursor and fetches
# only the rooms that are behind. So it bounds how long a gap lasts when the
# event stream is down, and it is the worst case for the first message in a
# brand-new room.
room_sync_interval = 300
# Reconnect backoff ceiling, seconds. The proxy in front of the signaling
# server drops every connection hourly whatever the traffic, so reconnect is an
# ordinary event rather than a fault.
reconnect_backoff_max = 60
# Ingest the relayed message directly instead of refetching the room. The
# relayed message was measured field-for-field identical to the fetched one on
# Talk 24.0.4, but this stays off by default: it is the only part of the design
# that can be wrong about message content rather than about timing. Talk sends
# a message with the event only from about Talk 21 — below that every event is
# a bare notification and switching this on changes nothing.
payload_direct = false

[email]
# Enable email functionality (requires himalaya to be installed)
enabled = true
# IMAP settings (for receiving)
imap_host = "imap.example.com"
imap_port = 993
imap_user = "istota@example.com"
imap_password = "app-password-here"
# SMTP settings (for sending) - defaults to IMAP credentials if not set
smtp_host = "smtp.example.com"
smtp_port = 587
# smtp_user = ""  # uses imap_user if empty
# smtp_password = ""  # uses imap_password if empty
# Polling settings
poll_folder = "INBOX"
bot_email = "istota@example.com"  # bot's email address (to skip own messages)
# imap_timeout_seconds = 30  # socket timeout for IMAP connections (fail fast on a dead host)
# A declaration about your inbound mail path, not a safety switch to flip on.
# SMTP From: is unauthenticated, so a From: naming a user's own address is a
# claim until something checks it. Three answers to "who checked it":
#
#   "off"     (default) something upstream already did — normally DMARC
#             enforcement at the receiving MTA, which rejects a forgery before
#             it ever reaches poll_folder. Nothing is ever held.
#   "verify"  your mail server did, and we read its verdict: a stamp from
#             authserv_id carrying an aligned dmarc=pass goes straight through,
#             anything else is held. Requires authserv_id — without one the
#             verdict comes off whichever header arrived on top, which the
#             sender writes, so the daemon refuses to start.
#   "gate"    nothing upstream does, so ask me. Holds every message a user
#             sends the bot for a yes/no.
#
# The legacy booleans still load: false is "off", true is "gate".
#
# "verify" is the one worth reaching for. "gate" has to ask about every
# self-sent message because nothing in a plain SMTP message separates the user
# from someone claiming to be them; the mail server's verdict is what finally
# tells them apart, so you are asked only when authentication actually failed.
# Prefer fixing things upstream regardless: it is silent and costs nothing per
# message. Leaving this "off" makes the mail path load-bearing — see the
# checklist in docs/features/email.md.
# confirm_sender_match = "off"
# The canary for the assumption above. Reads the DMARC verdict the receiving MTA
# stamped in Authentication-Results and warns when mail routed on a user's own
# address arrives without a pass — so the protection going away is noticed
# instead of being silent. On by default; it is monitoring, never a gate, and it
# changes nothing about how mail is handled. It detects misconfiguration and
# drift, not attack: a forged top header silences it, and the MTA is the boundary
# regardless.
# dmarc_canary = true
# Whether a *missing* DMARC verdict also warns. Off by default, because a mail
# path that stamps nothing would warn on every message. Turn it on once you know
# your MTA stamps — it is the only way "the mailbox moved to a provider that does
# not evaluate DMARC" ever surfaces.
# dmarc_canary_warn_on_missing = false
# Your receiving MTA's own authserv-id — the first field of the
# Authentication-Results header it stamps, before the semicolon. It is what tells
# your MTA's stamp from one the sender wrote. Blank (the default) reads the
# topmost header and trusts that "topmost" means "ours", which holds while the
# MTA stamps and inverts the moment it stops: with no stamp of your own, the
# sender's header is the top one and a forged dmarc=pass reads as a healthy path.
# Set this and a header from any other authserv-id is discarded rather than read;
# it must be the single token before the semicolon, without any version number
# that follows it.
# Setting it also says your MTA stamps, so mail arriving without your stamp warns
# on its own — dmarc_canary_warn_on_missing stays about a stamp of yours that
# carries no DMARC verdict. Find the value in a received message's own
# Authentication-Results header.
# authserv_id = "mx.example.com"
#
# The weakest outbound approval policy any user on this instance may run. The
# bot holds an outgoing email as an editable draft, rather than sending it, when
# its recipients are not explicitly authorized; the user approves or discards it
# from web chat or with `!drafts`. Three values:
#
#   off        no holds — every send goes out immediately
#   untrusted  hold unless EVERY recipient (To, Cc, Bcc) is trusted: one of the
#              user's own addresses, a `trusted_email_senders` pattern, or an
#              address they trusted at runtime via `!trust` / "yes trust"
#   all        hold unless every recipient is one of the user's own addresses
#
# This is a floor, not a default: a user may tighten past it (`all` over a
# `untrusted` floor) but never loosen below it. A user who has never touched
# their own setting follows this value, so raising it reaches everyone.
#
# Any single untrusted recipient holds the whole message — there are no partial
# sends. An invalid value here FAILS THE CONFIG LOAD rather than falling back:
# `off` would disable a gate you asked for and `untrusted` would override an
# `off` you meant, so there is no safe value to guess.
#
# Note that `trusted_email_senders` now means both "their mail skips the inbound
# gate" and "I may mail them without approving each message". A catch-all
# pattern there (`*`, `*@*`) turns the `untrusted` policy off entirely; it is
# logged when it happens, but narrow the pattern rather than relying on that.
# outbound_approval_floor = "untrusted"

[conversation]
# Enable conversation context (uses Sonnet to select relevant previous messages)
enabled = true
# Number of recent messages to consider
lookback_count = 25
# Include all messages without selection if history <= this threshold (faster for short threads)
skip_selection_threshold = 3
# Model for selecting relevant context. Accepts canonical IDs ("claude-haiku-4-5"),
# shortcuts ("haiku"), or role tiers ("fast" — default; resolves to Haiku via
# brain.claude_code.DEFAULT_ALIASES, operator-overridable via [models.aliases] below).
selection_model = "fast"
# Timeout for context selection
selection_timeout = 30.0
# Set to false to include all lookback messages without LLM selection (useful for testing)
use_selection = true
# Always include this many recent messages without selection (rest triaged by model)
always_include_recent = 5
# Max chars per bot response in conversation context (0 to disable truncation)
context_truncation = 0
# Number of recent unfiltered tasks to inject into context (ensures scheduled/briefing
# messages aren't orphaned when the user replies to them)
previous_tasks_count = 3
# Messages to fetch from Talk API for context (max 200, default 100)
# Talk API-based context shows all participants' messages, not just bot interactions
talk_context_limit = 100

[money]
# Whether the portfolio module may look up ticker metadata from a third-party
# quote API when classifying a newly imported symbol. The request carries the
# symbol — private financial data — and runs in the unsandboxed web/daemon
# process, outside the CONNECT allowlist. Off falls back to offline
# description heuristics, which need no network.
# autoclass_lookup = true

[logging]
# Log level: INFO (default) or DEBUG (verbose)
level = "INFO"
# Output destination: console, file, or both
output = "console"
# Log file path (when output includes "file")
# file = "/var/log/istota/istota.log"
# rotate = true
# max_size_mb = 10
# backup_count = 5

[scheduler]
# Seconds between checking for new tasks in the queue
poll_interval = 5
# Seconds between pending-task dispatch scans within a single poll tick. The
# periodic checks (briefings, email, heartbeat, …) stay on poll_interval; only
# the cheap pending-task scan runs at this finer cadence, so a freshly-enqueued
# task (e.g. a web chat message) is claimed within dispatch_interval instead of
# waiting up to a full poll_interval. Set to 0 or >= poll_interval for the
# legacy "one dispatch per poll tick" behaviour.
dispatch_interval = 0.5
# Seconds between polling Talk conversations
talk_poll_interval = 10
# Long-poll timeout for Talk API (server-side wait)
talk_poll_timeout = 30
# Max seconds to wait for all rooms before processing available results
# Rooms that respond faster (with new messages) are processed immediately;
# quiet rooms still long-polling are cancelled and re-polled next cycle
talk_poll_wait = 2.0
# How often every room is long-polled regardless of the lastMessage gate.
# Between sweeps only a room the room list already says has a newer message is
# polled, so a quiet cycle costs one short request instead of one held
# connection per room. The sweep is the safety net: it bounds what a gate that
# read wrongly can cost to this interval. 0 turns the gate off entirely and
# polls every room every cycle.
talk_poll_full_sweep_interval = 300
# Seconds between polling for new emails
email_poll_interval = 60
# Messages one email poll walks. The rest wait for the next tick and drain in order.
email_poll_batch_size = 50
# Inbound email volume budget. `bot+{user_id}@domain` is public by construction
# — it is the From: on every mail the bot sends on a user's behalf — so anyone
# who has ever corresponded with the bot can turn one SMTP transaction into a
# paid model invocation on that user's account. These cap how many. Over-budget
# mail is *filed*, not dropped: it stays in the mailbox, gets a `throttled`
# ledger row, and the user is told once per window, so nothing is lost and it
# can still be read on demand with `email from-senders`. 0 on either count
# disables that half.
email_rate_limit_messages = 60          # email tasks per user per window
email_sender_rate_limit_messages = 20   # …and per sender, so one loud correspondent throttles alone
email_rate_limit_window_seconds = 3600
# Untrusted-sender confirmation prompts per (user, sender) per window before
# they collapse into one summary notice. The held mail is still held and still
# individually approvable with `!confirm <task-id>`; only the interruption is
# collapsed. 0 = never collapse (one prompt per message, as before).
email_confirmation_prompts_per_window = 3
# Which worker queue inbound mail lands on. "background" keeps a flood from
# taking the slots a live Talk or web-chat turn needs, at the cost of slower
# mail turnaround; "foreground" restores the previous behaviour.
email_task_queue = "background"
# The body goes into the prompt whole, so one large message is its own
# amplification. Truncated with a marker past this; the full mail stays in the
# mailbox.
email_max_body_chars = 32000
# Attachment bytes written to disk and pushed to Nextcloud, per message and
# across one whole poll. This does NOT bound the IMAP transfer: the client
# fetches and decodes the whole message before any part can be inspected, so
# the bytes on the wire are the sender's choice regardless. Whole attachments
# only — one that would cross the budget is skipped rather than truncated, and
# the prompt says which. 0 = unlimited, as with the counts above.
email_max_attachment_bytes = 26214400
email_max_attachment_bytes_per_poll = 104857600
# Seconds between checking for briefings to run
briefing_check_interval = 60
# Seconds between polling TASKS.md files for new tasks
tasks_file_poll_interval = 30
# Seconds between scheduler_stats health-line emits (threads / fds / rss /
# running-tasks / active-workers). One key=value INFO line per interval on the
# istota.scheduler.stats logger — grep it in journalctl to catch resource leaks
# early. 0 disables the emit.
scheduler_stats_interval = 60

# Seconds between Nextcloud profile-picture import ticks (0 disables). Six
# hours. The import runs on a cadence rather than at login — a Nextcloud
# timeout in front of authentication — or on render, so the cost is that a user
# who has just signed in for the first time sees the initial chip until the
# next tick; daily would make that a whole day. Also gated by
# [web] avatar_import_from_nextcloud and by the storage backend being Nextcloud.
avatar_import_interval = 21600

# Seconds between full reindexes of the per-skill user overlays (0 disables).
# Six hours, matching the sweeps above. An overlay is edited over the mount as
# often as it is edited through a skill, so a directory pass is the only seam
# that sees every route. Deliberately not behind the sleep cycle's gates: a
# reindex makes no brain call, and putting it there stopped it running whenever
# the sleep cycle was off or the primary brain's breaker was open.
skill_overlay_reindex_interval = 21600

# Defense-in-depth: alert an operator if the single-threaded main dispatch loop
# stops ticking for this many seconds (a slow call that slipped onto the loop
# thread, a wedged check). A separate watchdog thread logs an ERROR and fires
# one alert, then re-arms when the loop recovers. 0 disables it.
loop_stall_alert_seconds = 180

# Progress / event streaming.
# Every task produces a typed, persisted event stream (the task_events table)
# consumed by all output surfaces: web chat SSE, Talk, push, log channel, admin.
# When enabled, Talk shows real-time tool progress as Claude works.
progress_updates = true
# Emit tool_start / tool_end events (the Talk ack edit + log channel use these).
progress_show_tool_use = true
# Emit intermediate assistant text events (can be noisy, off by default).
progress_show_text = false
# Write events to the task_events table. Operational kill-switch — when false,
# in-process consumers (Talk/log/push) still work but SSE/admin have nothing to read.
event_log_enabled = true
# Narration gate / substance bar for streamed answer text on stream surfaces
# (web chat / REPL). A text run streams nothing until it crosses this many
# characters without an intervening tool call. At a tool boundary a short
# lead-in ("Let me check…") that stayed under it is dropped; a substantial block
# that crossed it is kept (the web chat renders it as its own block rather than
# folding it into the activity chip). Higher = more pre-tool text folds away but
# short answers animate less (they still arrive whole via the final result);
# lower = more intermediate text is shown live. Keep equal to the web client's
# SUBSTANTIAL_TEXT_CHARS. 0 disables the gate. Watch the `stream_gate:` logs to
# tune.
stream_text_gate_chars = 280
# A push notification fires only when a task ran longer than this (short tasks
# don't need a ping — the user is likely still watching).
push_notification_threshold_seconds = 30
# Which task source_types trigger a push notification on completion. Empty by
# default: ntfy is opt-in, never a default surface. ntfy still fires for
# explicit requests (scheduled jobs with output_target=ntfy, heartbeat alerts).
# Add source_types here (e.g. ["talk"]) to opt back into completion pushes.
push_notification_sources = []

# Kill task execution after N minutes (default: 30)
task_timeout_minutes = 30
# Include selected skills in log channel messages (default: true)
log_channel_show_skills = true
# Robustness settings
# Auto-cancel tasks awaiting confirmation after N minutes (default: 120 = 2 hours)
confirmation_timeout_minutes = 120
# Log warnings for tasks pending longer than N minutes (default: 30)
stale_pending_warn_minutes = 30
# Auto-fail tasks pending longer than N hours (default: 24 = 1 day)
stale_pending_fail_hours = 24
# How often a running worker pings liveness, in seconds (default: 60; 0 disables).
# Reclaim uses this heartbeat to tell a slow-but-alive worker from a dead one.
worker_heartbeat_seconds = 60
# Reclaim a heartbeating worker's task after this many minutes of heartbeat
# silence (default: 10). Independent of task_timeout_minutes. Higher = fewer
# false-dead reclaims of a slow-but-alive worker (which would re-run the task),
# at the cost of slower recovery after a genuine worker crash.
worker_stuck_minutes = 10
# Delete completed/failed/cancelled tasks older than N days (default: 7)
task_retention_days = 7
# Prune token/cost rows after N days (default: 180, 0 to disable). Far above
# task_retention_days on purpose — spend records live in their own table so they
# outlive the tasks they came from. 180 rather than a year because the backup
# job snapshots the whole framework database into dated directories and keeps
# several of them, so every row here is duplicated on the backup target.
usage_retention_days = 180
# Delete emails older than N days from IMAP inbox (default: 7, 0 to disable).
# The sweep is an IMAP BEFORE search, so it is proportional to what has
# actually expired rather than to a fixed slice of the newest mail.
email_retention_days = 7
# Prune the processed_emails dedup ledger after N days (default: 90, 0 to
# disable). One row is written per polled message, including the ones that
# produce no task, so the table grows forever without this. Never applied
# below email_retention_days + 1: the row is what stops a message still
# sitting in the mailbox from being re-ingested as a brand-new task. With
# email_retention_days = 0 (mail never deleted from IMAP) the prune is
# disabled outright, since the message's lifetime is then unbounded too.
# A row still referenced by the stored conversation transcript is always
# kept — it also carries the sender attribution for that turn.
processed_email_retention_days = 90
# Max cached talk messages per conversation (default: 200)
talk_cache_max_per_conversation = 200

# Deferred subtask creation limits (defense against prompt-injection-driven fan-out).
# Subtasks are created when an admin task writes a deferred JSON request; these caps
# bound how much damage a single injected task can do.
# Max subtasks created per parent task (default: 10)
max_subtasks_per_task = 10
# Max chain depth — a task at depth N cannot spawn further subtasks when N >= max
# (default: 3, set to 0 to disable). With max=3 a chain like talk → subtask → subtask
# → subtask is allowed but no deeper.
max_subtask_depth = 3
# Skip deferred subtasks whose prompt exceeds this size in chars (default: 8000, 0 = unlimited)
max_subtask_prompt_chars = 8000

# Per-user worker pool settings
# Maximum concurrent foreground (interactive) worker threads
max_foreground_workers = 5
# Maximum concurrent background (scheduled/briefing) worker threads
max_background_workers = 3
# Global per-user worker defaults (individual users can override in their config)
# user_max_foreground_workers = 2
# user_max_background_workers = 1
# Cumulative-idle seconds a worker lingers (re-checking for new work on a fine
# cadence) before exiting. A follow-up task arriving inside this window is
# claimed within one worker_idle_poll_interval instead of waiting a full
# poll_interval.
worker_idle_timeout = 10
# Idle re-check cadence (seconds). While a worker lingers it polls for a new
# pending task every worker_idle_poll_interval, so a quick follow-up message is
# picked up sub-second. Set to 0 or >= worker_idle_timeout to restore the legacy
# single coarse wait + single recheck.
worker_idle_poll_interval = 0.5
# Busy-timeout (ms) for the main dispatch loop's read-only scans. A DB locked
# past this budget makes the loop skip the tick (it re-dispatches ~0.5s later)
# instead of blocking up to 30s and tripping the stall watchdog. 0 keeps the
# 30s default. Defense-in-depth on top of WAL — leave at 2000 unless you have a
# reason to change it.
main_loop_read_timeout_ms = 2000
# Snapshot local DBs (framework + per-user modules) to the Nextcloud mount for
# off-host durability — they left the Nextcloud-synced workspaces when they
# moved to local disk. Uses SQLite's online backup API (consistent live copy).
db_backup_enabled = true
db_backup_interval = 86400          # seconds between snapshots (daily)
# db_backup_dir = ""                # empty = {nextcloud_mount}/istota-db-backups

# Runtime self-check re-run. The auto-update cron changes what is installed
# under a config the daemon already loaded, so a boot-only check is blind to it.
# doctor_check_interval = 3600      # seconds between `istota doctor` re-runs (0 = disabled)

# Host memory: the breadcrumb series, the admission gate, and the snapshots.
# The breadcrumb is one host_pressure line per interval carrying MemAvailable /
# Shmem / SwapFree / PSI / per-tmpfs usage / shmem_unaccounted, written whether
# or not anything is wrong. The gate reads a faster sample and refuses to *start*
# work below the floor — pending rows wait, nothing running is stopped, and every
# uncertain case (no sample, unreadable sample, sampling off) fails open.
# host_pressure_enabled = true                 # master switch for all three
# host_pressure_breadcrumb_interval_seconds = 300  # breadcrumb cadence (0 = disabled)
# host_pressure_sample_interval_seconds = 30   # gate/snapshot sample cadence (0 = disabled)
# min_available_memory_mb = 768                # admission floor in MB (0 = disable this half)
# host_pressure_psi_threshold = 40.0           # `memory some avg10` above this counts as pressure (0 = disable this half)
# host_pressure_alert_cooldown_seconds = 900   # min gap between snapshots + admin notifications
# host_pressure_shmem_unaccounted_alert_mb = 1024  # third snapshot trigger; NOT wired into the gate (0 = disabled)
# host_pressure_docker_socket = "/var/run/docker.sock"  # read-only, resolves a container's pid for a snapshot; "" disables

# Per-task cgroups. Each task's process tree gets its own cgroup v2 group, so a
# runaway build or test suite is OOM-killed inside its own group instead of
# taking the host down. Needs `Delegate=` and `DelegateSubgroup=supervisor` on
# the scheduler unit; without them containment never engages and the daemon says
# so once at startup rather than looking protected.
# task_cgroup_enabled = true        # place each task's tree in its own cgroup
# task_memory_max_mb = 2048         # memory.max per task (0 = unbounded)
# task_pids_max = 512               # pids.max per task — bounds a fork storm
# task_cpu_max_percent = 200        # cpu.max as % of one core (200 = two cores; 0 = unset)

# ============================================================================
# Default briefings (shared canonical set)
# ============================================================================
# A canonical briefing set seeded once into each opted-in user (per-user
# `default_briefings = true`, the default). Same name/cron/output/blocks shape
# as a per-user briefing; content is blocks-only. Seed-once: a user's later web
# edits win and re-runs never clobber them. Omit the section for no defaults.
#
# [[default_briefings]]
# name = "Daily"
# cron = "0 7 * * *"
# output = "talk"
#
#   [[default_briefings.blocks]]
#   title = "World News"
#   render_mode = "synthesis"
#
#     [[default_briefings.blocks.sources]]
#     kind = "browse"
#     config = { preset = "ap" }

# ============================================================================
# Shared briefing blocks (module-owned curated content)
# ============================================================================
# Generated ONCE globally by the scheduler (no user, UTC cron) and written into
# the shared_kv store; per-user briefings read them via a `shared_block` (or
# `kv`) source, so the N-way frontpage fetch + synthesis collapses to one
# generation total. Only user-agnostic source kinds are allowed: browse /
# markets / email (the shared/unowned pool).
#
# Omit the section entirely to seed the batteries-included defaults
# (world-headlines, markets-summary). An explicit empty list opts out.
#
# [[briefing_shared_blocks]]
# name = "world-headlines"          # → shared_kv key in namespace "briefing_shared_blocks"
# cron = "45 5,17 * * *"            # twice daily, ~15 min before the briefing windows; UTC (global)
# title = "🌍 Headlines"
# directive = "Synthesize the frontpages into ~8 top world stories."
# render_mode = "synthesis"
# enabled = true
#
#   [[briefing_shared_blocks.sources]]
#   kind = "browse"
#   config = { preset = "ap" }
#
#   [[briefing_shared_blocks.sources]]
#   kind = "browse"
#   config = { preset = "reuters" }
#
# A consuming briefing then reads it:
#   [[users.alice.briefings.blocks.sources]]
#   kind = "shared_block"
#   config = { name = "world-headlines", max_age_hours = 12 }

# ============================================================================
# Skills (routing)
# ============================================================================
# Skill routing is single-axis and has no configuration. A skill is either
# eager — selected deterministically (always_include / source_types / file_types
# / sticky / companions), full body in the prompt — or in the on-demand menu, a
# one-line entry the model loads in full via `istota-skill skills show <name>`.
# The menu is the full eligible catalogue minus the eager set, so the model
# self-selects any tool on demand while the prompt stays small. The former
# `[skills]` block (progressive_disclosure / auto_lazy_threshold_chars /
# always_eager) was removed; a stale block is ignored with a load-time warning.

# ============================================================================
# Memory search
# ============================================================================
# BM25 search over conversations and memory files, behind `!search` and the
# memory-recall path. On by default and cheap: the index is SQLite FTS, and
# nothing here needs the `memory-search` extra — that extra buys semantic
# (embedding) search on top, and its absence degrades to BM25 rather than
# switching the block off.
#
# `auto_recall` is the one to think about. Off, memory is recalled when the
# model asks for it; on, the task prompt itself is used as a query and the top
# hits are injected into every task. That costs prompt budget on every task
# including the ones that want no memory at all, which is why it is off.

# [memory_search]
# enabled = true
# auto_index_conversations = true
# auto_index_memory_files = true
# auto_recall = false                  # inject BM25 hits for the task prompt into every task
# auto_recall_limit = 5                # max results when auto_recall is on
# recency_half_life_days = 180.0       # decay applied to recall scores so a dense old
#                                      #   cluster cannot win on mass alone. 0 = no decay

# [playbooks]                          # Learned playbooks (procedural memory) — off by default
# enabled = false                      # master gate
# recall_limit = 3                     # top-K playbooks injected per task
# min_tool_calls = 4                   # a task must use >= this many tools to qualify
# retention_days = 90                  # 0 = keep forever; >0 = age-prune by last-use (recall refreshes it)
# max_chars = 0                        # 0 = share the global max_memory_chars budget

# ============================================================================
# Model alias registry [models.aliases] (operator override) — optional
# ============================================================================
# One operator-visible table overlaying the code-shipped defaults
# (brain.claude_code.DEFAULT_ALIASES). It holds BOTH the portable tiers and the
# provider shortcuts, base names only — effort is the orthogonal :effort modifier.
# Shipped defaults:
#   fast    → claude-haiku-4-5    (used by: context triage, skill classification)
#   general → claude-sonnet-5     (used by: sleep cycle extraction + USER.md curation)
#   smart   → claude-opus-5     (exists for `!model smart` from Talk + any code
#                                  path that wants "the best model")
#   opus / sonnet / haiku         (shortcuts → the current latest of each)
#
# Rebind any alias to a canonical ID, a shortcut, or a custom name accessible via
# `!model <name>` from Talk. Effort composes with the :effort modifier
# (`smart = "opus:high"`), never a separate alias. Two forms:
#
# 1. Flat (namespace-agnostic) — resolved by whichever brain runs the task:
#      [models.aliases]
#      smart = "claude-opus-4-7:high"   # rebind "smart" to Opus 4.7, effort high
#      deep  = "opus:max"               # a custom alias for deep-thinking tasks
#
# 2. Per-namespace (define ONCE, correct on every brain family) — an operator
#    running a claude_code primary + native fallback, or [brain.source_type_overrides]
#    routing some source types to native, gives each namespace its own value so
#    one alias never leaks a foreign-namespace string onto the wire:
#      [models.aliases.smart]
#      anthropic     = "opus:high"                                   # CLI brains (claude_code / tmux_claude)
#      openai_compat = { model = "anthropic/claude-opus-4.8", effort = "high" }  # native
#      [models.aliases.general]
#      anthropic     = "claude-sonnet-5"
#      openai_compat = "anthropic/claude-sonnet-4.6"                 # bare string = no effort
#      [models.aliases.deep]
#      anthropic     = "opus:max"
#      openai_compat = "anthropic/claude-opus-4.8"
#      portable      = true                                          # a cross-brain custom tier
#
# Alias targets CARRY EFFORT: a :effort modifier on the target (`opus:high` → high)
# or an explicit `effort =` on a per-namespace table reaches the wire (explicit
# wins). `anthropic` covers both CLI brains; `openai_compat` is the native endpoint
# slug (sent verbatim, never translated from the Anthropic namespace). A custom
# alias is a non-portable pin unless flagged `portable = true` (then a canonical
# tier that re-resolves across the cross-brain fallback boundary).
#
# TOML note: an alias uses ONE form — a flat `smart = "..."` and a
# `[models.aliases.smart]` table are mutually exclusive (a key can't be both a
# string and a table). A per-namespace table missing the active brain's key falls
# to that brain's own code default (Haiku/Sonnet/Opus for CLI; the configured
# native.model for native).
#
# The old [models.roles] key is a HARD RENAME to [models.aliases] — the old key is
# no longer read; a stale one logs a one-time migration warning. The old
# effort-in-name forms (`opus-high`, `opus-46`) no longer resolve — use `opus:high`
# or the canonical id + modifier (`claude-opus-4-6:high`).

# ============================================================================
# Sleep Cycle (nightly memory extraction)
# ============================================================================
# Extracts long-term memories from completed tasks for each user nightly.
# Cron evaluated in each user's timezone (e.g., "0 2 * * *" = 2am local).
# Memories written to /Users/{user_id}/memories/YYYY-MM-DD.md.

# [sleep_cycle]
# enabled = true                       # enabled by default
# cron = "0 2 * * *"                  # 2am in user's timezone
# extraction_model = "general"         # model that reads the day's conversations and writes memories
# curation_model = "general"           # model that runs the nightly USER.md curation pass
#                                      # Both are role aliases resolving through [models.aliases];
#                                      # a canonical id or an :effort modifier works here too.
# memory_retention_days = 0            # 0 = unlimited; >0 nightly deletes both dated memory FILES and
#                                      # ephemeral memory_chunks (conversation, memory_file, channel_memory)
#                                      # older than N days. Durable user_memory chunks are not swept.
# lookback_hours = 24                  # how far back to look for interactions
# auto_load_dated_days = 3             # auto-load N days of dated memories into prompts (0 = disabled)
# curate_user_memory = false           # nightly USER.md curation (op-based: append/add_heading/remove)
# curation_log_summary = true          # post one-line "USER.md curated: +N appended, ..." to user log_channel
# knowledge_graph_audit_retention_days = 365  # prune knowledge_facts_audit older than N days
#                                              # (independent of memory_retention_days so default
#                                              # deployments still prune; 0 = unlimited)

# ============================================================================
# Channel Sleep Cycle (shared channel memory extraction)
# ============================================================================
# Extracts shared memories from channel conversations nightly.
# Auto-discovers active channels — no explicit channel list needed.
# Cron evaluated in UTC since channels span users in different timezones.

# [channel_sleep_cycle]
# enabled = true                    # enabled by default
# cron = "0 3 * * *"               # 3am UTC (after user sleep cycles at 2am)
# extraction_model = "general"      # model that writes the shared channel memories;
#                                   # a role alias, resolved through [models.aliases]
# lookback_hours = 24               # how far back to look for interactions
# memory_retention_days = 0           # 0 = unlimited; >0 nightly deletes dated channel memory files
#                                     # and channel_memory chunks older than N days

# ============================================================================
# Developer Skill (Git + GitLab/GitHub Workflows)
# ============================================================================
# Enables Claude Code to work in git repositories, create GitLab merge requests,
# and GitHub pull requests. Uses bare clones + git worktrees for branch isolation.
# Recommended: use dedicated bot accounts with minimal required permissions.

# The bot drives the real `gh` and `glab`, not a REST client of our own. Both
# run behind the wrapper in `src/istota/forge_cli.py`: it checks the argv
# against a deny policy first, and only then fetches the token and puts it in
# the CLI's own environment — a denied command contacts nothing and fetches no
# credential. With `[security] skill_proxy_enabled` on, the token comes from
# the proxy socket per call; with it off, from the task environment. The token
# needs the scopes those CLIs use, which is more than the old REST allowlist
# needed:
# GitLab `api` + `write_repository`, GitHub `repo` (plus `read:org` for an org
# repo, and `workflow` only if the bot must touch Actions workflow files).
# Reissue a narrower token before enabling this.
#
# One instance per forge. `gitlab_url` and `github_url` are single strings, and
# everything downstream derives from them: the CONNECT allowlist gets one host
# per configured URL, the git credential helpers install under a per-host
# `credential.{host}.helper` key, and the wrapper points `GITLAB_HOST` /
# `GH_HOST` at that one host. A repository on a *second* GitLab or GitHub
# instance is therefore unreachable — the CONNECT proxy refuses it before
# anything authenticates, which is safe but opaque. Adding the second host to
# `[security.network] extra_hosts` buys reachability and no credential, so the
# clone still fails. There is no supported way to configure two of either.
#
# `git` itself is not wrapped and knows nothing about either forge: public
# reads work against any allowlisted host, authenticated pushes only against
# the two configured ones, and no policy gates git at all. Force-push
# protection belongs to the forge's branch rules, for the same reason
# `pr merge` is left un-denied here.

# [developer]
# enabled = false
# repos_dir = "/srv/repos"                          # base dir for clones + worktrees
#
# # GitLab settings
# gitlab_url = "https://gitlab.com"                 # GitLab instance URL (one instance only — see above)
# gitlab_token = "glpat-xxxxxxxxxxxxxxxxxxxx"        # API token (api + write_repository)
# gitlab_username = "botuser"                        # GitLab username for HTTPS auth
# gitlab_default_namespace = "example"                # default namespace for short repo names
# gitlab_reviewer = "reviewer-user"                  # GitLab username to assign as MR reviewer
# gitlab_reviewer_id = "1234567"                     # that user's numeric id — recorded, read by nothing
#
# # GitHub settings
# github_url = "https://github.com"                 # GitHub instance URL, or GitHub Enterprise (one instance only)
# github_token = "ghp_xxxxxxxxxxxxxxxxxxxx"          # Personal access token (repo scope)
# github_username = ""                               # GitHub username (defaults to x-access-token)
# github_default_owner = "myorg"                     # default org/user for short repo names
# github_reviewer = "reviewer-user"                  # GitHub username to request as PR reviewer
#
# # Forge CLI policy. The baseline deny list lives in code, not here — it is a
# # safety default rather than a preference. These two knobs extend and
# # puncture it. Write an entry as you would type it; one with no binary name
# # applies to both CLIs. A `forge_cli_permit` entry that matches no baseline
# # rule is warned about at startup, because a hatch that silently stopped
# # matching reads exactly like one that is still open.
# forge_cli_extra_denied = ["gh pr merge"]           # refuse these too
# forge_cli_permit = ["gh repo delete"]              # turn a baseline guard off
#
# # Where the real binaries live. The Ansible role renders these from what it
# # installed; set them by hand if gh or glab is somewhere else.
# gh_bin_path = "/usr/local/bin/gh"
# glab_bin_path = "/usr/local/bin/glab"
#
# # Author credit appended to every commit message the bot writes. This is the
# # only trailer the `commit` skill permits; nothing else is ever appended.
# author_credit = "Co-Authored-By: Bot <bot@example.invalid>"
#
# # Worktree reaping. Nothing used to remove a task's worktree, so `repos_dir`
# # grew gigabyte checkouts with no owner. A scheduler job (see
# # `[scheduler] worktree_reap_interval`) removes only a worktree that is clean
# # (untracked and gitignored files included), unlocked, idle for the window
# # below, and carrying no commit that is not already upstream — squash- and
# # rebase-merged branches included. Everything else is kept and counted.
# #
# # The window is what protects a task running *right now*: the sweep is
# # periodic and knows nothing about the worker pool, so recent activity is the
# # only evidence available that a checkout is in use. It is clamped to a
# # one-hour floor, because a worktree seconds old is clean and carries nothing
# # that is not upstream — the reapable state — so a shorter window would take
# # the checkout of a task still setting it up. To pin one indefinitely, use
# # `git worktree lock` rather than turning the sweep off.
# worktree_reap_enabled = true
# worktree_retention_hours = 24.0

# ----------------------------------------------------------------------------
# Where project code builds and runs
# ----------------------------------------------------------------------------
# **There is no key for this.** It is derived from `[devbox] enabled` together
# with `[developer] enabled` and a non-empty `repos_dir`. A deploy-time choice,
# not a runtime one: within a deployment there is exactly one place a build
# happens, which is what keeps the property a per-command fallback would cost —
# nothing on the host ever consumes an environment the container built, so no
# parity rule has to hold.
#
# Without a devbox, npm, uv, cargo and the rest run on the host inside the
# task's bwrap sandbox, where they cannot reach a registry that is not on the
# CONNECT allowlist and cannot install a system package. With one, they run in
# that user's devbox over a Unix-socket exec transport.
#
# A `backend` key used to sit in the block below and say which. It is retired,
# and a file still carrying it gets a warning at load and a WARN from `doctor`.
# Retiring it removed two states rather than a knob: the devbox on with the
# backend off offered the model a devbox skill whose every verb but `reset`
# refused, and the backend on with the devbox off asked the developer skill to
# reach a container nothing had built. If you set it to "none" to keep builds on
# the host, turn `[devbox] enabled` off instead — that is now the one switch.
#
# The devbox image has to be built with the daemon's own uid; the Ansible role
# does that from a `getent` lookup. A mismatched uid is the one failure with no
# error message anywhere that names it: the container cannot write into a
# worktree the daemon made, and once that is worked around the daemon cannot
# unlink a tree the container made, so every worktree that ever ran a build
# becomes permanently unreapable.
#
# Check it with `istota doctor --only developer.container`, which answers four
# questions that each fail silently: does this file derive what the running
# daemon believes, does the transport answer, do the two sides agree on uid and
# repos root, and is the uv cache mounted.
#
# Note `repos_dir` above is a *per-user root* **on every backend, including
# "none"**: the daemon derives `{repos_dir}/{user_id}` and hands that to the
# sandbox bind, `DEVELOPER_REPOS_DIR` and the credential scrub. That is what
# closes cross-user worktree access, and it has nothing to do with containers —
# so an upgraded host must move its existing clones down a level before the
# developer skill can see them again. The Ansible role does it; with more than
# one configured user it needs `istota_developer_repos_migrate_to` and fails the
# play until it gets one, because a green play there is followed by a daemon
# restart into a state where the bind names an empty directory.

# [developer.container]
# exec_socket_dir = "/run/istota-exec" # the parent; the socket is {dir}/{user}/exec.sock
# connect_timeout_seconds = 5.0        # the client's connect budget
# idle_timeout_seconds = 3600          # server-side backstop reap for an idle connection
#
# # The commands fronted by a shim. Two absences are deliberate and one of them
# # is not negotiable. `python3` is refused whatever you write here: the sandbox
# # starts its own network bridge with it, so a shim would route that into the
# # container and break egress for every developer-enabled task. `make` is
# # merely omitted — shimming a *driver* inverts routing for everything beneath
# # it, so a Makefile calling git, gh or python3 would get the container's
# # copies. Add it if you know your Makefiles; the cost of leaving it out is a
# # Makefile that calls ./node_modules/.bin/foo by path.
# shim_commands = [
#     "npm", "npx", "pnpm", "yarn", "node",
#     "uv", "uvx", "pip", "pip3",
#     "cargo", "rustc", "rustup",
#     "go", "bundle", "gem",
# ]

# ----------------------------------------------------------------------------
# The devbox container
# ----------------------------------------------------------------------------
# A persistent per-user Linux workbench, one container per user, provisioned by
# Ansible (image, network, volume). Only the bare-metal role builds one — the
# shipped Docker stack ships no devbox service and cannot run the skill; see
# docs/deployment/docker.md.
#
# `enabled` is ONE SWITCH DOING TWO JOBS, deliberately. It offers the devbox
# skill, and it is also what the developer skill derives its execution target
# from — with it on (plus [developer] enabled and a repos_dir) project code
# builds and runs in the user's container instead of on the host. They used to
# be separate keys and the separation only produced states nobody wanted.
#
# What this does NOT bound is what the model may do inside the container: `dev`
# has passwordless sudo there, so a task with access is already root in it. The
# boundary is the container, not anything in this block.

# [devbox]
# enabled = false
# container_prefix = "devbox-"         # container name = f"{prefix}{user_id}"
# docker_cli = "/usr/bin/docker"       # host path to the Docker CLI. Used by the
#                                      #   `reset` verb only — everything else speaks
#                                      #   the exec transport over a Unix socket, and
#                                      #   no Docker socket is bound into any sandbox.
# max_output_bytes = 102400            # stdout/stderr cap per stream in the JSON envelope
#
# The socket directory is [developer.container] exec_socket_dir above, not a key
# here: one spelling of /run/istota-exec in the tree, read by the skill CLI, the
# sandbox bind and doctor alike.

# ----------------------------------------------------------------------------
# Code review (`istota-skill code_review run`)
# ----------------------------------------------------------------------------
# One or two text-only reviewers over a branch diff, run daemon-side through the
# configured brain. Gated by `developer.enabled` and an admin check as well as
# the flag below, so there is no separate feature switch. The defaults give a
# working review on any repository you have already enabled [developer] for.
#
# The reviewers are invoked with no tools requested and no sandbox wrapper: the
# CLI assembles everything they see from the repository, because a model-authored
# prompt deciding what the daemon reads is the boundary this design exists to
# keep. On the native brain an empty tool list is enforced in-process; on
# claude_code it means the CLI is passed neither an allow-list nor
# --dangerously-skip-permissions, which leaves the guarantee resting on the
# upstream CLI's own default rather than on something this repo enforces.
#
# Two ceilings sit above `timeout_seconds`, and the lower one bites first. The
# skill proxy kills the command at this skill's own ceiling — 540s, and *not*
# the global `security.skill_proxy_timeout`; override it with a `code_review`
# entry under `[security.skill_proxy_timeouts]`. Below that, the sandboxed model calls
# the CLI through its own Bash tool, whose limit is 120s — so the model must
# invoke the command with an explicit extended timeout, which
# `code_review/skill.md` tells it to do.
#
# A `timeout_seconds` that does not fit under the proxy ceiling is clamped down
# rather than honoured, since the alternative is a review killed half-finished
# having already paid for its agents. The fit reserves 30s: 20 for assembly and
# 10 for the thread join the CLI really waits out. The clamp warns into the
# daemon log and reports itself in the envelope as `agent_timeout_clamped`,
# alongside the `agent_timeout_seconds` each reviewer actually got.
#
# `overhead_seconds` in the envelope is what everything outside the model calls
# cost on that run, which is the evidence the 20s reserve is sized from.

# [developer.review]
# enabled = true                      # false disables the CLI; the workflow then
#                                     # reports "review unavailable" and lands anyway
# conformance_model = "general"       # role alias; a ":effort" modifier is honoured
# bughunt_model = "smart:high"        # e.g. "general:medium", "smart:high"
# both_agents_threshold_lines = 150   # over this, both reviewers run
# boundary_patterns = [               # case-insensitive substrings of changed paths;
#     "auth", "secret", "credential", "token", "password",   # a hit forces both
#     "migration", "schema.sql", "billing", "payment", "money",
#     "crypto", "sandbox", "proxy", "deploy", "ansible",
# ]
# max_diff_chars = 200000
# max_context_chars = 60000
# max_file_chars = 20000              # per changed file for whole-body inclusion;
#                                     # over it, that file falls back to its hunks
# max_callers_per_symbol = 8
# max_need_files = 6                  # files a reviewer may request on the one
#                                     # re-invocation; 0 disables the round trip
# timeout_seconds = 480               # per agent; both run concurrently, so this is
#                                     # wall time, not half of it. The bug hunter runs
#                                     # a high-effort model and only on large diffs, and
#                                     # 240 was measured too short for it on every real
#                                     # one. --timeout on `run` overrides it for one run
# max_calls_per_task = 8              # review rounds per task. A round is a wave of model
#                                     # calls, not a run: a run charges 1, or 2 when a
#                                     # reviewer takes its max_need_files round trip. One
#                                     # wave is up to four invocations (two agents, each
#                                     # retrying a malformed answer once), so a run is at
#                                     # most two rounds and six calls.
#                                     # 0 or less permits none — use enabled = false to
#                                     # switch the feature off. At the cap the review
#                                     # degrades to skipped rather than erroring

# ============================================================================
# Browser container (the `browse` skill)
# ============================================================================
# A Chrome instance in its own container with bot-detection countermeasures,
# talked to over HTTP. Without it the `browse` skill has nowhere to go; the
# rest of the deployment is unaffected. Requires an x86-64 host — Chrome has no
# ARM packages — and Docker, so it is off by default and provisioned by the
# Ansible role or the Docker stack's `browser` compose profile.
#
# `api_url` is read from inside whatever process runs the skill, so on the
# Docker stack it is the service name (`http://istota-browser:9223`) and on
# bare metal a loopback port. Getting it wrong fails at connect with nothing
# to say why, so `istota doctor` checks it.

# [browser]
# enabled = false
# api_url = "http://localhost:9223"
# vnc_url = ""                    # external noVNC URL, if you expose the live view.
#                                 #   The console no longer binds all interfaces;
#                                 #   put it behind the reverse proxy, not on 0.0.0.0.

# ============================================================================
# ntfy Push Notifications
# ============================================================================
# ntfy is a per-user connected service, configured by each user via the web
# settings UI (`/istota/settings`) or `istota secret ensure -s ntfy ...`.
# There is no operator-shared block — each user supplies their own server,
# topic, and (optional) auth.

# ============================================================================
# Money (accounting)
# ============================================================================
# The money skill runs in-process — there is no instance-level [money]
# block. Per-user access is on by default; opt out via the user's
# `disabled_modules` profile field. Ledger files are auto-discovered from
# `{workspace}/money/ledgers/*.beancount`.

# ============================================================================
# Public Hostname
# ============================================================================
# The deployment's public DNS name. Used by the web UI (OAuth2 redirect +
# origin/CSRF checks) and the location webhook URL — set it whenever the web
# or location features are enabled.
#
# The bot's static web root (`enabled` + `base_path`) was removed: a
# publicly-served directory the agent could write to was an outbound egress
# channel with no confirmation gate. Serve static assets outside istota, from
# a directory the agent cannot reach.

# [site]
# hostname = "istota.example.com"

# ============================================================================
# Authenticated Web Interface (Nextcloud built-in OAuth2)
# ============================================================================
# Login-protected web UI backed by Nextcloud's built-in OAuth2 provider
# (no extra NC apps required). Register an OAuth 2.0 client in
# Nextcloud: Settings > Administration > Security > OAuth 2.0 clients,
# redirect URI https://{hostname}/istota/callback. Auth-only flow:
# code exchange → identity check via OCS → token discarded.

# [web]
# enabled = false
# port = 8766
#
# How the web UI authenticates. "nextcloud" (the default) uses the OAuth2 flow
# below. "none" bypasses authentication entirely: every request is the single
# configured local user, who is always admin. That is the single-user local
# install's shape, and the web app refuses to start with it on anything but a
# loopback bind. Overridable by ISTOTA_WEB_AUTH.
# auth = "nextcloud"                               # "nextcloud" | "none"
# oauth2_provider = "https://cloud.example.com"   # public NC URL the browser hits
# oauth2_client_id = "istota-web"
# oauth2_client_secret = ""                        # or ISTOTA_WEB_OAUTH2_CLIENT_SECRET env var
# session_secret_key = ""                          # or ISTOTA_WEB_SESSION_SECRET_KEY env var
#
# Optional overrides (defaults derive from oauth2_provider):
# oauth2_token_endpoint = ""                       # server-to-server token URL
# oauth2_userinfo_endpoint = ""                    # server-to-server identity URL
# oauth2_redirect_uri = ""                         # explicit override; otherwise derived from request
#
# User-scoped OAuth token retention. "ephemeral" (default) discards the OAuth
# pair after login. "encrypted" retains it in the web_user_tokens table,
# encrypted with the web-only ISTOTA_WEB_TOKEN_KEY env var (>=32 chars,
# delivered to the web unit ONLY — never the scheduler/webhooks). Enables
# post-as-user Talk mirroring of web messages and web<->Talk read-state sync.
# NC OAuth2 tokens grant full account access, so this is a deliberate opt-in.
# token_storage = "ephemeral"                      # "ephemeral" | "encrypted"
#
# Byte cap on a profile-picture upload, in KB. Checked on the declared
# Content-Length before the body is read and again on the running total, so an
# oversized upload is refused rather than buffered. Distinct from nginx's
# client_max_body_size, which is sized for chat attachments. 0 switches
# uploads off (the endpoint answers 503); a stored picture is still served.
# max_avatar_kb = 4096
#
# Whether the scheduler imports users' Nextcloud profile pictures. Only a
# *custom* avatar is ever imported: Nextcloud generates a coloured letter for a
# user who has set none, and importing that would swap the app's own initial
# chip for Nextcloud's version of the same idea, with nothing downstream able to
# tell them apart. Inert on a local storage backend. The cadence is
# [scheduler] avatar_import_interval.
# avatar_import_from_nextcloud = true

# Background tiles for the map surfaces (location today; anything geospatial
# later). The default needs no key and no setup, so this block is only for an
# operator who wants a different provider.
#
#   openfreemap  free OSM vector tiles, no key, no account, dark + light.
#                Still a third-party request, so it does not make map viewing
#                private — it just needs no credential.
#   carto        the previous default. Requires a free API key since 2026;
#                without one every tile comes back stamped "API KEY REQUIRED"
#                with a 200 status, so nothing but a human notices. Get one at
#                https://carto.com/basemaps/apikey/ — and note CARTO is
#                retiring its raster service, so this buys time, not a fix.
#                Set without a key, this falls back to openfreemap rather than
#                serving watermarked tiles, and `istota doctor` says so.
#   osm          keyless raster last resort. Light tiles only, so the dark
#                theme looks wrong, and the OSMF tile usage policy discourages
#                application use.
#   custom       your own MapLibre style URLs, e.g. a self-hosted tile server.
#                One URL is enough; it then covers both themes.
#
# api_key travels inside the tile URL to every browser that loads a map, so it
# is public by construction — treat it as disclosed, whatever it is called.
# Each user can also set their own CARTO key on the location settings page,
# which selects CARTO for them and overrides whatever is set here.
# [web.map]
# provider = "openfreemap"                         # openfreemap | carto | osm | custom
# api_key = ""                                     # carto only; public
# dark_style = ""                                  # custom only: MapLibre style URL
# light_style = ""                                 # custom only
# attribution = ""                                 # custom only

# In-app web chat surface (always-on companion to Talk; reachable from the
# "Chat" tab). All knobs have sensible defaults — this block is only for tuning.
# [web.chat]
# max_prompt_chars = 32000
# max_attachment_mb = 25
# attachment_extensions = ["pdf", "png", "jpg", "jpeg", "heic", "webp", "gif", "txt", "md", "csv", "wav", "mp3", "m4a", "ogg", "webm", "docx", "xlsx"]
# rate_limit_messages = 30                          # per window, per user
# rate_limit_window_seconds = 300
# sse_poll_interval_ms = 200                        # server-side SSE generator cadence
# client_poll_interval_ms = 1500                    # client polling fallback cadence
#
# Live room-event stream (GET /chat/stream). One user-scoped SSE connection per
# open tab carries every room the user is a member of, so a Talk turn, a routed
# alert, or a message in a background room reaches the browser in about a second
# whatever surface produced it.
# room_stream_poll_interval_ms = 1000               # server-side tail cadence
# room_stream_keepalive_seconds = 20                # SSE comment frame, keeps proxies from dropping an idle stream
# room_stream_max_batch = 500                       # rows before a `gap` frame tells the client to reload
# room_stream_max_bytes = 2000000                   # serialized-byte budget, same purpose
# room_stream_room_check_seconds = 10               # per-connection room-metadata diff (0 disables)
# talk_read_sync_interval = 60                      # Talk→web read pull cadence (s); 0 disables; needs token_storage = "encrypted"

# ============================================================================
# Google Workspace Integration
# ============================================================================
# Enables the gws CLI skill with OAuth-based authentication.
# Users connect their Google account through the web UI.
# Requires a Google Cloud project with OAuth 2.0 credentials:
# https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: https://{hostname}/istota/google/callback

# [google_workspace]
# enabled = false
# client_id = ""
# client_secret = ""    # or ISTOTA_GOOGLE_WORKSPACE_CLIENT_SECRET env var
# scopes = [
#     "https://www.googleapis.com/auth/drive.readonly",
#     "https://www.googleapis.com/auth/gmail.readonly",
#     "https://www.googleapis.com/auth/calendar.readonly",
#     "https://www.googleapis.com/auth/spreadsheets.readonly",
#     "https://www.googleapis.com/auth/documents.readonly",
# ]

# Briefings module (per-user content store + archive). All fields defaulted —
# an absent block is the shipped behaviour.
# [briefings]
# archive_retention_days = 90     # prune archived results older than this (0 = keep forever)
# default_lookback_hours = 12     # seeds the email/rss source window when a source omits it
# max_source_chars = 5000         # cap on a single source's gathered text
# max_browse_chars = 20000        # same cap for a browse source, which gathers markdown
                                  # rather than flattened text (the URLs it keeps cost
                                  # characters, and a frontpage opens with masthead chrome)
# newsletter_max_links_per_source = 20  # inline [anchor](url) links kept per newsletter body.
                                  # Newsletters are link soup, so the converter drops
                                  # unsubscribe / social / web-version chrome and this caps
                                  # what survives; an over-cap anchor keeps its text and
                                  # loses only the destination. 0 = unlimited
# shared_block_timezone = "UTC"   # timezone shared (global) blocks evaluate their cron in;
                                  # typically the operator's own zone so the morning/evening
                                  # regeneration windows line up with their day

# Location / GPS. `enabled` starts the webhook receiver that Overland (and the
# Garmin ingest) post pings to; without it the Location tab has nothing to
# show, so this is off by default. The receiver is a separate process —
# `istota-webhooks` under systemd, the `location` compose profile on Docker —
# and it needs the public hostname under [site] to build the ingest URL.
#
# The reconcile settings below re-derive closed visits from the raw pings on a
# schedule, which is what turns a noisy GPS trace into places and visits. The
# defaults are tuned and rarely worth changing; the two that are are
# `accuracy_threshold_m` for a phone that reports poor fixes indoors, and
# `visit_exit_minutes` for how long "away" has to last before a visit ends.

# [location]
# enabled = false
# webhooks_port = 8765
# accuracy_threshold_m = 100.0    # drop pings worse than this from place matching
# visit_exit_minutes = 5.0        # continuous time away before a visit is closed
# reconcile_enabled = true        # periodically re-derive closed visits from pings
# reconcile_lookback_hours = 6.0  # window of pings each reconcile pass considers
# reconcile_buffer_minutes = 10.0 # leave pings newer than this alone (they are still arriving)
# reconcile_grace_minutes = 10.0  # time away before an unassigned ping closes a visit
# reconcile_min_pings = 3         # at-place pings needed to count as a visit
# reconcile_min_dwell_sec = 60    # duration needed to count as a visit

# Health module. Only knob is the per-document size cap for paperwork
# attached to an encounter / condition / immunization (scans, discharge
# summaries, vaccination cards).
# [health]
# max_document_bytes = 26214400   # 25 MiB. 0 = unlimited, for a scanner that
                                  # produces genuinely large files

# User configuration
# Map Nextcloud usernames to their settings
# Only messages from configured users will be processed
# email_addresses maps email addresses to users for email input channel

[users.alice]
display_name = "Alice"
email_addresses = ["alice@example.com", "alice.work@company.com"]
timezone = "America/New_York"  # IANA timezone for briefing scheduling
# alerts_channel = "alertsroom456"  # Talk room for confirmations and security alerts
# trusted_email_senders = ["*@company.com"]  # trusted in both directions: their mail
                               # skips the inbound confirmation gate, and mail to them
                               # is sent without waiting for approval
# outbound_approval = "all"    # this user's own outbound approval policy:
                               # off | untrusted | all. Omit (or "") to follow
                               # `[email] outbound_approval_floor`, which is a
                               # minimum — a value weaker than it has no effect.
                               # Read only when the user has no profile row yet;
                               # for an existing user the DB row wins, so set it
                               # with `istota user ensure --outbound-approval`.
# external_turn_display = "full"  # how much of a turn that arrived from outside the
                               # room (an external contact's email) shows inline in
                               # web chat: full | collapsed (default) | hidden. The
                               # turn itself is always shown. Editable by the user
                               # on the web settings page.
# briefing_email_html = false  # briefing email as plain text only. Default (true) sends
                               # multipart/alternative — HTML with clickable article links
                               # plus a plain-text fallback part. Also settable per user via
                               # `istota user ensure --no-briefing-email-html` or the web UI
                               # (Briefings → settings → Email delivery).

# Alice's resources — only `folder` (an out-of-workspace sandbox mount)
# is declarable after the Resources sunset. todo/reminders/notes are
# briefing-source properties (set the source `path`), and calendars are
# CalDAV-discovered.
# [[users.alice.resources]]
# type = "folder"
# path = "/shared/Projects"
# name = "Projects"
# permissions = "write"

# Alice's briefings. Content is config-authored blocks (the sole content model);
# schedule + delivery come from name/cron/conversation_token/output. When a
# briefing declares `blocks`, they are seeded ONCE into the user's briefings
# module DB as an editable baseline. After the first materialisation the briefing
# is an ordinary editable per-user briefing; the user reorders/edits it in the
# web editor and operator re-runs never re-clobber it (seed-once). `blocks` are
# never stored in the framework DB — they live only in this config and are
# consumed by the module-DB seeder. See the per-kind config reference below.
[[users.alice.briefings]]
name = "morning"
cron = "0 6 * * *"  # 6am in user's timezone
conversation_token = "room123"  # Talk room to post to
output = "talk,email"  # talk / email / ntfy, or a comma list (default: "talk")

  [[users.alice.briefings.blocks]]
  title = "Today"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "calendar"
    config = {}

    [[users.alice.briefings.blocks.sources]]
    kind = "todos"
    config = {}

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}

[[users.alice.briefings]]
name = "world"
cron = "0 7 * * *"
output = "email"

  [[users.alice.briefings.blocks]]
  title = "World News"
  directive = "3–5 stories, neutral tone, no markets."
  render_mode = "synthesis"          # synthesis | structured (omit to infer)
  options = { story_count = 5 }

    [[users.alice.briefings.blocks.sources]]
    kind = "rss"                     # a Feeds subscription or category
    config = { feed_ref = { kind = "category", value = 4 }, lookback_hours = 24, limit = 10 }

    [[users.alice.briefings.blocks.sources]]
    kind = "browse"                  # a bundled preset or arbitrary URL frontpage
    config = { preset = "ap" }

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}


[users.bob]
display_name = "Bob"
email_addresses = ["bob@example.com"]
timezone = "America/Los_Angeles"

# Bob has no briefings or sleep cycle configured


